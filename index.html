<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compréhension avec Haresh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Passage left (sticky), one question at a time on the right; hints on hover, translations on click, brackets on request */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#E8EEF6; --ink:#17222E; --muted:#556577; --line:#D2DCE8;
  --accent:#2A5FA5; --accent-ink:#FFFFFF; --accent-soft:#DAE7F7;
  --good:#17724A; --good-bg:#DDF2E6; --warn:#8F5700; --warn-bg:#FFF0D2; --bad:#B0372C; --bad-bg:#FBE2DF;
  --tip-bg:#1B2837; --tip-ink:#F2F6FB; --tip-muted:#A9BAD0;
  --q1:#FFF0A0; --q2:#C7EFD2; --q3:#CDE3FA; --q4:#F9D0D0; --q5:#E2D3F5; --q6:#FFD8B0; --q7:#BDEAEA; --decoy:#E1E4E8;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F29; --surface-2:#1D2935; --ink:#E7EDF4; --muted:#9BACBE; --line:#2A3847;
  --accent:#7DB0EE; --accent-ink:#0E141B; --accent-soft:#213650;
  --good:#6ED3A0; --good-bg:#15372A; --warn:#F0B55E; --warn-bg:#3A2D12; --bad:#F19488; --bad-bg:#43211D;
  --tip-bg:#E9EFF6; --tip-ink:#14202C; --tip-muted:#4C5F74;
  --q1:#5C5114; --q2:#1F4B33; --q3:#1F4068; --q4:#5B2B2B; --q5:#44305F; --q6:#5F3D17; --q7:#1B5050; --decoy:#313A44;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F29; --surface-2:#1D2935; --ink:#E7EDF4; --muted:#9BACBE; --line:#2A3847;
  --accent:#7DB0EE; --accent-ink:#0E141B; --accent-soft:#213650;
  --good:#6ED3A0; --good-bg:#15372A; --warn:#F0B55E; --warn-bg:#3A2D12; --bad:#F19488; --bad-bg:#43211D;
  --tip-bg:#E9EFF6; --tip-ink:#14202C; --tip-muted:#4C5F74;
  --q1:#5C5114; --q2:#1F4B33; --q3:#1F4068; --q4:#5B2B2B; --q5:#44305F; --q6:#5F3D17; --q7:#1B5050; --decoy:#313A44;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); padding-block:18px 56px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
#app{max-width:1180px; margin:0 auto}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; padding-bottom:12px; border-bottom:2px solid var(--accent)}
.brand{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 14px}
.brand-name{font:700 1.35rem/1.2 var(--serif); color:var(--accent)}
.brand-sub{color:var(--muted); font-size:.9rem}
.prog{display:flex; gap:6px; list-style:none; margin:0; padding:0; flex-wrap:wrap}
.pip{min-width:38px; text-align:center; padding:3px 8px; border-radius:999px; font-size:.78rem; font-weight:600; border:1.5px solid var(--line); color:var(--muted); background:var(--surface)}
.pip[data-s="active"]{border-color:var(--accent); color:var(--ink); box-shadow:0 0 0 2px var(--accent-soft)}

.intro{margin:14px 0 10px; max-width:70ch; color:var(--muted)}
.kit{list-style:none; margin:0 0 18px; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:8px}
.kit-step{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.kit-n{flex:none; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:.78rem; font-weight:700; display:grid; place-items:center; margin-top:1px}
.kit-t{display:flex; flex-direction:column; font-size:.84rem; line-height:1.35; min-width:0}
.kit-t span{color:var(--muted)}

.cols{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:20px; align-items:start}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px}
.reading{position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; padding:22px 26px 20px}
.title{margin:0 0 12px; font:700 1.5rem/1.25 var(--serif); text-wrap:balance}
.passage{margin:0; font:1.12rem/1.95 var(--serif)}
.foot{margin:14px 0 0; color:var(--muted); font-size:.85rem; font-style:italic}

.w{cursor:pointer; border-radius:3px; transition:background-color .12s}
.w:hover{background:var(--accent-soft)}
[data-h]{text-decoration:underline dotted var(--accent); text-decoration-thickness:1.5px; text-underline-offset:5px}
.hov{background:var(--accent-soft)}
.w.sel{background:var(--accent); color:var(--accent-ink); text-decoration:none}
.mk{font-weight:700}

.qs{display:flex; flex-direction:column; gap:14px; min-width:0}
.qs-title{margin:0; font:700 1.05rem/1.2 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.q{padding:16px 18px 16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.q[data-state="active"]{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.q[data-state="locked"] .qtext{opacity:.85}
.qhead{display:flex; gap:12px; align-items:flex-start}
.qchip{flex:none; background:var(--qc); color:var(--ink); border-radius:6px; padding:2px 9px; font-weight:700; font-size:.9rem; line-height:1.5}
.qtext{margin:0; font:1.05rem/1.6 var(--serif); min-width:0}
.lock{margin:0; font-size:.88rem; color:var(--muted)}
.ans-box,textarea.ans{width:100%}
textarea.ans{font:1.05rem/1.55 var(--serif); padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); resize:vertical; min-height:86px}
textarea.ans:disabled{opacity:.55; cursor:not-allowed}
textarea.ans:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ans[readonly]{background:var(--surface-2)}
.acc{display:flex; flex-wrap:wrap; gap:5px}
.acc-b{min-width:34px; height:34px; padding:0 8px; border:1px solid var(--line); background:var(--surface); border-radius:6px; cursor:pointer; font:1rem var(--serif)}
.acc-b:hover{background:var(--accent-soft)}
.q[data-state="locked"] .acc{opacity:.5; pointer-events:none}
.q[data-state="locked"] .actions{display:none}
.actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.att{color:var(--muted); font-size:.86rem}
.btn{border-radius:8px; padding:9px 16px; font-weight:600; font-size:.95rem; cursor:pointer; border:1.5px solid var(--accent); background:transparent; color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55; cursor:default}
.btn.ghost{align-self:flex-start}

.fb{border-radius:8px; padding:12px 14px; background:var(--surface-2); border-left:5px solid var(--muted)}
.fb[data-v="pass"]{background:var(--good-bg); border-color:var(--good)}
.fb[data-v="almost"],.fb[data-v="start"]{background:var(--warn-bg); border-color:var(--warn)}
.fb[data-v="retry"]{background:var(--bad-bg); border-color:var(--bad)}
.fb[data-v="model"]{background:var(--accent-soft); border-color:var(--accent)}
.fb-title{margin:0 0 6px; font-weight:700}
.fb-sub{margin:6px 0 0; font-size:.9rem; color:var(--muted)}
.model{margin:0; font:1.05rem/1.55 var(--serif); font-style:italic}
.fb-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.fb-item,.row{display:flex; gap:9px; align-items:flex-start}
.txt{min-width:0; font-size:.94rem; line-height:1.45}
.tag{flex:none; min-width:26px; text-align:center; padding:1px 7px; border-radius:5px; font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:var(--surface); color:var(--ink); border:1px solid var(--line); margin-top:1px}
.t-ok{background:var(--good); color:var(--bg); border-color:transparent}
.t-t,.t-q,.t-p{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.t-lane,.t-trap{background:var(--warn); color:var(--bg); border-color:transparent}
.t-grammar,.t-french,.t-sentence{background:var(--bad); color:var(--bg); border-color:transparent}
.fb-item.soft .tag{background:transparent; color:var(--muted)}

.ask{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center}
.ask-note{color:var(--muted); font-size:.82rem}
.ask-out{flex-basis:100%; white-space:pre-wrap; padding:10px 12px; border-radius:8px; background:var(--surface-2); font-size:.94rem; line-height:1.5}
.recap{border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:6px}
.recap-t{margin:0; font-size:.78rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.nextrow{display:flex}
.finish{padding:18px 20px}
.finish h2{margin:0 0 6px; font:700 1.3rem/1.2 var(--serif)}
.fin-list{list-style:none; margin:10px 0 14px; padding:0; display:flex; flex-direction:column; gap:6px}
.fin-list li{display:flex; gap:10px; align-items:center}

.pop,.tip{position:fixed; z-index:30; left:0; top:0; border-radius:10px; box-shadow:0 8px 28px rgba(8,16,28,.28)}
.pop{width:min(310px, calc(100vw - 16px)); background:var(--surface); color:var(--ink); border:1px solid var(--line); padding:10px 14px 12px}
.pop-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.pop-word{font:700 1rem var(--serif); color:var(--accent)}
.pop-x{border:0; background:transparent; font-size:1.4rem; line-height:1; cursor:pointer; color:var(--muted); padding:0 4px}
.pop-en{font:600 1.25rem/1.3 var(--sans); margin-top:2px}
.pop-note{color:var(--muted); font-size:.86rem; margin-top:3px}
.pop-strat{margin-top:9px; padding-top:8px; border-top:1px dashed var(--line)}
.tip{max-width:min(360px, calc(100vw - 16px)); background:var(--tip-bg); color:var(--tip-ink); padding:9px 12px; pointer-events:none; display:flex; flex-direction:column; gap:6px}
.tip .tag{background:var(--tip-ink); color:var(--tip-bg); border:0}
.tip .txt{font-size:.88rem}
.tip-head{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--tip-muted)}
.tip-sep{border-top:1px solid var(--tip-muted); opacity:.4}

@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .reading{position:sticky; top:env(safe-area-inset-top, 0px); z-index:6; max-height:44vh; max-height:44dvh; padding:10px 14px 10px; box-shadow:0 8px 14px -8px rgba(8,16,28,.35)}
  .reading[data-size="s"]{max-height:26vh; max-height:26dvh}
  .reading[data-size="l"]{max-height:64vh; max-height:64dvh}
  .reading .title{font-size:1.05rem; margin:0}
  .passage{font-size:1rem; line-height:1.7; margin-top:6px}
  .foot{margin-top:8px; font-size:.8rem}
  .reading .paneb{display:inline-block}
  .cols{gap:12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; scroll-behavior:auto!important} }
[hidden]{display:none!important}

/* ===== v2 additions ===== */
.top{align-items:flex-end}
.pick{display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1 1 380px; justify-content:flex-end; min-width:0}
.pick label{font-size:.8rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.sel-wrap{flex:1 1 260px; max-width:520px; min-width:0}
select.psel{width:100%; font:600 .95rem var(--sans); padding:8px 10px; border:1.5px solid var(--accent); border-radius:8px; background:var(--surface); color:var(--ink)}
.navb{border:1.5px solid var(--line); background:var(--surface); border-radius:8px; width:38px; height:38px; cursor:pointer; font-size:1.1rem}
.navb:hover{background:var(--accent-soft)}
.navb:disabled{opacity:.4; cursor:default}
.meter{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:12px 0 4px}
.score-badge{font:700 1.1rem var(--serif); color:var(--accent)}
.kit-d{margin:0 0 16px}
.kit-d summary{cursor:pointer; font-weight:600; color:var(--accent); padding:4px 0}
.kit-d .kit{margin:8px 0 0}
.pip[data-s="done"]{background:var(--qc); border-color:transparent; color:var(--ink)}
.pip[data-s="kept"]{background:var(--surface-2); color:var(--ink); border-style:dashed}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.78rem; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--ink); border:1px solid var(--line)}
.qmarks{margin-left:auto; flex:none; font-size:.82rem; font-weight:700; color:var(--muted); white-space:nowrap}
.passage,.qtext{white-space:pre-line}
.markline{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; font-size:.92rem}
.markline strong{font:700 1.15rem var(--serif); color:var(--accent)}
.markline span{color:var(--muted)}
.btn.warnb{border-color:var(--warn); color:var(--warn)}
.btnrow{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center}
.hintnote{font-size:.84rem; color:var(--muted)}
.fb[data-v="full"]{background:var(--good-bg); border-color:var(--good)}
.fb[data-v="most"],.fb[data-v="some"]{background:var(--warn-bg); border-color:var(--warn)}
.fb[data-v="none"]{background:var(--bad-bg); border-color:var(--bad)}
.hint-box{border-radius:8px; padding:10px 12px; background:var(--accent-soft); border-left:5px solid var(--accent); font-size:.94rem}
.t-hint,.t-w{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.t-style{background:transparent; color:var(--muted)}
.w.in{background:var(--bc)}
.x.in{background:var(--bc)}
.w.bs,.x.bs{position:relative; margin-left:.55em}
.bs::before{content:"["; position:absolute; left:-.5em; top:-.12em; font:300 1.6em/1 var(--sans); color:var(--accent)}
.be{position:relative; margin-right:.55em}
.be::after{content:"]"; position:absolute; right:-.5em; top:-.12em; font:300 1.6em/1 var(--sans); color:var(--accent)}
.fin-tot{font:700 2rem/1 var(--serif); color:var(--accent)}
.fin-grid{display:grid; gap:8px; margin:12px 0}
.fin-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line)}
.fin-row small{color:var(--muted)}
.fin-form{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0}
.fin-form label{display:flex; flex-direction:column; gap:3px; font-size:.82rem; font-weight:600; color:var(--muted); flex:1 1 180px}
.fin-form input{font:1rem var(--sans); padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink)}
.fin-msg{margin:8px 0 0; font-size:.9rem; color:var(--muted)}
.fin-note{font-size:.84rem; color:var(--muted); margin:10px 0 0}
.w.in,.x.in{border-radius:0; transition:none; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.w.in:hover{background:var(--bc); filter:brightness(.95)}

.reading,.qhead,.hint-box,.fb,.model,.finish .fin-grid{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
textarea.ans,.fin-form input,.ask-out{-webkit-user-select:text; user-select:text}
.nopaste{margin:0; font-size:.86rem; font-weight:600; color:var(--warn)}

.reading-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.paneb{display:none; flex:none; border:1.5px solid var(--accent); background:var(--surface); color:var(--accent); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700; cursor:pointer}
@media (min-width:901px){ .paneb{display:none} }

</style>

<script>
var DATA={"P":[{"id":"p00","label":"2026","title":"L'alimentation du futur","passage":"Aujourd'hui, dans les pays riches, les gens mangent souvent trop de viande, de sucre et de graisse. Cela peut provoquer des maladies graves comme l'obésité, le diabète ou les problèmes de cœur. Il y a 100 ans, les gens mangeaient plus de légumes, de fruits et de céréales. Nos habitudes ont beaucoup changé, et cela pose des problèmes pour la santé, mais aussi pour la planète. À l'avenir, la population mondiale sera encore plus nombreuse. Dans certains pays pauvres, les gens ont déjà du mal à manger à leur faim. Il faut donc trouver de nouvelles solutions pour nourrir tout le monde. Les scientifiques cherchent des idées originales et efficaces. Par exemple, on peut créer des fermes de la mer pour élever* des poissons, comme on élève des vaches à la campagne. C'est une bonne solution pour avoir plus de nourriture. On peut aussi cultiver des algues dans la mer. Elles poussent* facilement et peuvent aussi produire de l'énergie sous forme de gaz. Une autre idée est d'utiliser les plantes et les feuilles pour fabriquer des protéines végétales. Ces protéines peuvent remplacer la viande. Les chercheurs arrivent même à fabriquer de fausses saucisses ou côtelettes qui ressemblent à la vraie viande. Ces nouvelles formes de nourriture peuvent sembler étranges aujourd'hui, mais elles pourraient devenir normales demain. Elles sont très utiles pour lutter* contre la faim et protéger la planète. Dans le futur, nous mangerons peut-être des steaks aux algues ou des gâteaux aux fleurs !","foot":"(* élever – to breed ; * pousser – to grow ; * lutter – to fight)","qs":[{"text":"Qu'est-ce qui provoque les maladies chez les gens dans les pays riches ? Lesquelles ?","marks":2.0,"t":"pr","model":"Manger trop de viande, de sucre et de graisse provoque des maladies graves comme l'obésité, le diabète et les problèmes de cœur.","pts":[{"label":"the cause","groups":[["viande","sucre","graisse"]]},{"label":"which illnesses","groups":[["obesite","diabete","coeur"]]}],"maxWords":45},{"text":"Les gens d'autrefois, que mangeaient-ils ?","marks":1.0,"t":"imp","model":"Ils mangeaient plus de légumes, de fruits et de céréales.","pts":[{"label":"what they ate","groups":[["legume","fruit","cereale"]]}],"maxWords":24},{"text":"Selon le texte, est-ce vrai que nos habitudes d'alimentation mènent uniquement aux problèmes de santé ? Justifiez votre réponse.","marks":1.0,"t":"pr","model":"Non, ce n'est pas vrai : elles posent des problèmes pour la santé, mais aussi pour la planète.","pts":[{"label":"no\" and the planet","groups":[["non"],["planete"]]}],"maxWords":36},{"text":"Pourquoi doit-on trouver des solutions pour nourrir tout le monde ?","marks":1.0,"t":"pr","model":"Parce que, dans certains pays pauvres, les gens ont déjà du mal à manger à leur faim.","pts":[{"label":"the reason","groups":[["pauvre","faim"]]}],"maxWords":36},{"text":"Comment peut-on produire plus de nourriture dans la mer ?","marks":2.0,"t":"pr","model":"On peut créer des fermes de la mer pour élever des poissons et on peut aussi cultiver des algues dans la mer.","pts":[{"label":"fish farms","groups":[["ferme","poisson"]]},{"label":"algae","groups":[["algue"]]}],"maxWords":45},{"text":"Qu'est-ce que les scientifiques fabriquent avec des plantes et des feuilles et qu'est-ce qu'elles peuvent remplacer ?","marks":1.5,"t":"pr","model":"Ils fabriquent des protéines végétales, qui peuvent remplacer la viande.","pts":[{"label":"what they make","groups":[["proteine"]]},{"label":"what it replaces","groups":[["viande"]]}],"maxWords":24},{"text":"Quelle sera l'importance des nouvelles formes de nourriture dans l'avenir ? Donnez deux raisons.","marks":1.5,"t":"fut","model":"Elles seront très utiles pour lutter contre la faim et protéger la planète.","pts":[{"label":"fighting hunger","groups":[["faim","lutter"]]},{"label":"protecting the planet","groups":[["proteg","planete"]]}],"maxWords":29}]},{"id":"p01","label":"1995","title":"Les villes nouvelles","passage":"Le gouvernement français a décidé, en 1965, de créer cinq villes nouvelles dans la région parisienne pour planifier l'urbanisme et le développement. L'architecture de ces villes est originale. Evry est le chef-lieu du département de l'Essonne. La ville nouvelle comporte des bâtiments administratifs, un ensemble culturel social et sportif, un centre commercial et des logements. Le centre de la ville s'appelle l'Agora. Il y a de nombreux espaces verts avec plans d'eau. Marne-la-Vallée n'est pas encore terminée. Elle s'étend sur trois départements autour de Noisy-le-Grand. Saint-Quentin-en-Yvelines est à quelques kilomètres de Versailles. Le centre des sept Mares est un quartier caractéristique avec sa rue commerçante piétonne, ses immeubles administratifs et son lycée. Cergy-Pontoise a été construit au bord de l'Oise en forme de fer à cheval; les types de logements y sont variés. Melun-Sénart est situé dans une région de forêts et d'étangs, encore très peu urbanisée. On y a construit surtout des maisons individuelles et des petits immeubles.","foot":"","qs":[{"text":"Qui a décidé de créer des villes modernes ?","marks":2.0,"t":"pc","model":"Le gouvernement français a décidé de créer des villes nouvelles.","pts":[{"label":"who","groups":[["gouvernement"]]}],"maxWords":24},{"text":"Pourquoi a-t-on décidé de créer ces villes ?","marks":1.5,"t":"pc","model":"On a décidé de créer ces villes pour planifier l'urbanisme et le développement.","pts":[{"label":"the reason","groups":[["planif","urbanisme","developpement"]]}],"maxWords":29},{"text":"Combien y a-t-il de villes ? Quels sont leurs noms ?","marks":2.5,"t":"pr","model":"Il y a cinq villes : Evry, Marne-la-Vallée, Saint-Quentin-en-Yvelines, Cergy-Pontoise et Melun-Sénart.","pts":[{"label":"how many","groups":[["cinq","5"]]},{"label":"the names","groups":[["evry"],["marne"],["quentin"],["cergy"],["melun"]],"min":4}],"maxWords":38},{"text":"Où est situé Melun-Sénart ?","marks":1.5,"t":"pr","model":"Melun-Sénart est situé dans une région de forêts et d'étangs.","pts":[{"label":"the place","groups":[["foret","etang"]]}],"maxWords":25},{"text":"Quelles sont les caractéristiques principales d'Evry ?","marks":2.5,"t":"pr","model":"Evry est le chef-lieu du département de l'Essonne ; la ville comporte des bâtiments administratifs, un centre commercial et des logements.","pts":[{"label":"main town","groups":[["chef","essonne"]]},{"label":"features","groups":[["administratif","commercial","logement","cultur","sportif","agora","vert"]]}],"maxWords":43}]},{"id":"p02","label":"1996","title":"Mali","passage":"6 600 000 habitants vivent au Mali. La densité est faible : 3,8 habitants au km². Essentiellement campagnarde, la population est très inégalement répartie sur le territoire malien. Les quatre cinquièmes dans la partie occidentale du pays, un dixième dans les villes dont les plus importantes sont Bamako, la capitale, et Kayes. On y trouve vingt-trois ethnies ; les plus importantes sont les Bambaras, les Malinkés et les Dogons. Les musulmans sont 64%, 34% des Maliens sont animistes et 2% chrétiens. Le français est la langue officielle, mais chaque ethnie a sa langue propre.","foot":"","qs":[{"text":"Le Mali est-il un pays très peuplé ?","marks":2.0,"t":"pr","model":"Non, le Mali n'est pas un pays très peuplé : la densité est faible.","pts":[{"label":"no\" and why","groups":[["non"],["faible","densite"]]}],"maxWords":29},{"text":"Où est-ce que la plupart des Maliens vivent ?","marks":2.0,"t":"pr","model":"La plupart des Maliens vivent dans la partie occidentale du pays.","pts":[{"label":"the place","groups":[["occidentale","ouest"]]}],"maxWords":25},{"text":"Quelle est la capitale du Mali ?","marks":2.0,"t":"pr","model":"La capitale du Mali est Bamako.","pts":[{"label":"the capital","groups":[["bamako"]]}],"maxWords":16},{"text":"Combien y a-t-il des ethnies au Mali ? Quelles langues parlent-ils ?","marks":2.5,"t":"pr","model":"Il y a vingt-trois ethnies ; le français est la langue officielle, mais chaque ethnie a sa langue propre.","pts":[{"label":"how many","groups":[["vingt","23"]]},{"label":"the languages","groups":[["francais","propre"]]}],"maxWords":40},{"text":"Quelles sont les importantes ethnies du Mali ?","marks":1.5,"t":"pr","model":"Les ethnies les plus importantes sont les Bambaras, les Malinkés et les Dogons.","pts":[{"label":"the names","groups":[["bambara"],["malinke"],["dogon"]]}],"maxWords":29}]},{"id":"p03","label":"1998","title":"Parc du Baoulé","passage":"Dans la région de Bamako, le touriste peut visiter la réserve de Fina, la forêt des Monts Mandingues et la Boucle du Baoulé constituées en Parc National où se trouve une faune riche et variée. Le Parc du Baoulé est situé à 120 km au Nord-ouest de Bamako ; on y arrive par la route du Nord jusqu'à Kati, puis par la piste vers l'ouest jusqu'à Madina. Retour possible par Kita. Le Parc est ouvert du 1er décembre au 1er juin ; la meilleure période de visite s'étend de janvier à avril. D'une superficie de 350 000 ha, le Parc du Baoulé et trois réserves ont été créés en 1954 en vue de protéger les représentants de la grande faune malienne : buffle, girafe, lion… Outre l'intérêt qu'elle présente, la visite de ce parc peut constituer une très agréable détente dans un cadre d'une grande beauté.","foot":"","qs":[{"text":"Où se trouve la réserve de Fina ?","marks":2.0,"t":"pr","model":"La réserve de Fina se trouve dans la région de Bamako.","pts":[{"label":"the place","groups":[["bamako"]]}],"maxWords":25},{"text":"Pour aller de Kati à Madina, prend-on une route ou une piste ?","marks":2.0,"t":"pr","model":"Pour aller de Kati à Madina, on prend une piste.","pts":[{"label":"road or track","groups":[["piste"]]}],"maxWords":24},{"text":"Quand peut-on visiter le Parc du Baoulé ?","marks":2.0,"t":"pr","model":"On peut visiter le Parc du Baoulé du 1er décembre au 1er juin.","pts":[{"label":"the dates","groups":[["decembre"],["juin"]]}],"maxWords":29},{"text":"Pourquoi a-t-on créé ce Parc et trois réserves ?","marks":1.5,"t":"pc","model":"On a créé ce Parc et trois réserves pour protéger les représentants de la grande faune malienne.","pts":[{"label":"the reason","groups":[["proteg","faune"]]}],"maxWords":36},{"text":"Qu'entendez-vous par : « Une faune riche et variée. » (Expliquez cette expression sans répéter les phrases du texte)","marks":2.5,"t":"op","model":"Une faune riche et variée veut dire qu'il y a beaucoup d'animaux de différentes espèces.","pts":[{"label":"animals","groups":[["animau","animal","bete"]]},{"label":"many kinds","groups":[["differ","divers","plusieurs","nombreux","beaucoup","espece","sorte","type"]]}],"maxWords":33}]},{"id":"p04","label":"1999","title":"Consignes de sécurité pour la circulation sur les pistes sahariennes","passage":"A. Équipement personnel : Lit de camp ou matelas mousse, sac de couchage. Vêtements légers pour la journée, très chauds pour la nuit. Pharmacie. Consulter un médecin avant le départ. Réserves d'eau, très variables selon la saison : on boit entre 2 et 6 litres par jour selon la température. Il faut compter 2 jours de sécurité sur les très grands axes et jusqu'à 5 jours sur les pistes peu fréquentées. B. Précautions indispensables — Avant de prendre la route, il faut savoir que : Il est toujours plus prudent de voyager à plusieurs voitures, même si ce n'est pas obligatoire sur certaines pistes. Il faut toujours signaler son départ et son arrivée aux autorités administratives qui assurent la sécurité (douane, police, gendarmerie ou armée selon les cas). Dans certaines régions, il est prudent de prendre un guide local qui connaît la piste. Il ne faut jamais quitter la piste ou en tout cas ne jamais la perdre de vue.","foot":"","qs":[{"text":"Que faut-il prévoir pour la nuit dans le Sahara ?","marks":2.0,"t":"pr","model":"Pour la nuit, il faut prévoir des vêtements très chauds, un lit de camp ou un matelas mousse et un sac de couchage.","pts":[{"label":"what to bring","groups":[["chaud","couchage","lit","matelas"]]}],"maxWords":47},{"text":"Quelle quantité d'eau doit-on prévoir, par jour ?","marks":2.0,"t":"pr","model":"On doit prévoir entre deux et six litres d'eau par jour.","pts":[{"label":"the quantity","groups":[["deux","2"],["six","6"]]}],"maxWords":25},{"text":"Est-il obligatoire de voyager à plusieurs voitures sur certaines pistes ?","marks":2.0,"t":"pr","model":"Non, ce n'est pas obligatoire de voyager à plusieurs voitures sur certaines pistes.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":29},{"text":"À quoi peut servir un guide local ?","marks":2.0,"t":"pr","model":"Un guide local peut servir à connaître la piste.","pts":[{"label":"its use","groups":[["connai","piste"]]}],"maxWords":22},{"text":"Avant de voyager sur les pistes sahariennes, quelles précautions devons-nous prendre ?","marks":2.0,"t":"pr","model":"Avant de voyager, nous devons voyager à plusieurs voitures, signaler notre départ et notre arrivée aux autorités, prendre un guide local et ne jamais quitter la piste.","pts":[{"label":"precautions","groups":[["voiture"],["signaler"],["autorite"],["guide"],["piste"]],"min":2}],"maxWords":54}]},{"id":"p05","label":"2000","title":"Vous ne buvez pas de vin, sortez ! (témoignage de M. Patrice Tripier de Villefranche)","passage":"Un jour de juillet, je me suis arrêté, avec mon amie, dans un hôtel-pension de Saint-Jean-Cap-Ferrat avec l'intention de prendre le repas de midi. Après nous avoir fait choisir notre menu, notre « hôtesse » nous a demandé ce que nous voulions boire. Comme nous ne buvons pas d'alcool ni l'un ni l'autre, nous avons commandé de l'eau. Et c'est là que, d'un ton coléreux, cette dame nous a répondu : « Vous ne buvez même pas de vin, je ne vous servirai pas, vous n'avez qu'à sortir ! » Ce que nous avons fait aussitôt devant tant de bêtise. (Excusez la dureté mais je ne trouve pas d'autre mot). J'ajoute que, par goût, mon amie boit peu de vin, mais qu'en plus elle est Américaine et qu'une telle réaction l'a écœurée et n'a pas rehaussé l'opinion qu'elle peut avoir de la France. Quant à moi, par goût je n'ai aucun penchant pour l'alcool, mais en outre, pour de sérieuses raisons médicales, j'ai intérêt à ne pas en boire. Je ne vois pas pourquoi je me ruinerais la santé pour renflouer la caisse des bistrots. (Le Monde, 9 août 1980)","foot":"","qs":[{"text":"Quel est le nom du journal dans lequel a paru cet article ?","marks":1.5,"t":"pc","model":"Cet article a paru dans Le Monde.","pts":[{"label":"the newspaper","groups":[["monde"]]}],"maxWords":18},{"text":"Qui nous a apporté ce témoignage ?","marks":1.5,"t":"pc","model":"M. Patrice Tripier nous a apporté ce témoignage.","pts":[{"label":"who","groups":[["patrice","tripier"]]}],"maxWords":20},{"text":"Quelle était la nationalité de l'amie de M. Patrice Tripier ?","marks":1.5,"t":"imp","model":"L'amie de M. Patrice Tripier était américaine.","pts":[{"label":"nationality","groups":[["americain"]]}],"maxWords":18},{"text":"Pourquoi est-ce que M. Patrice Tripier est allé à l'hôtel-pension ?","marks":1.5,"t":"pc","model":"M. Patrice Tripier est allé à l'hôtel-pension pour prendre le repas de midi.","pts":[{"label":"the reason","groups":[["repas","midi","dejeuner","manger"]]}],"maxWords":31},{"text":"Où est situé cet hôtel ?","marks":1.0,"t":"pr","model":"Cet hôtel est situé à Saint-Jean-Cap-Ferrat.","pts":[{"label":"the place","groups":[["saint","ferrat"]]}],"maxWords":22},{"text":"Pourquoi est-ce que M. Patrice Tripier n'a pas commandé d'alcool ?","marks":1.0,"t":"pc","model":"Il n'a pas commandé d'alcool parce qu'il n'a aucun penchant pour l'alcool et, pour de sérieuses raisons médicales, il a intérêt à ne pas en boire.","pts":[{"label":"the reason","groups":[["penchant","medica","sante","buv","boit","boire"]]}],"maxWords":52},{"text":"Pourquoi est-ce que la dame a refusé de servir M. Patrice Tripier ?","marks":1.0,"t":"pc","model":"La dame a refusé de servir M. Patrice Tripier parce qu'il ne buvait pas de vin.","pts":[{"label":"the reason","groups":[["vin"]]}],"maxWords":34},{"text":"Après le refus de l'hôtesse, qu'est-ce que M. Patrice Tripier a fait ?","marks":1.0,"t":"pc","model":"Après le refus de l'hôtesse, M. Patrice Tripier est sorti aussitôt.","pts":[{"label":"what he did","groups":[["sort","quitt","part"]]}],"maxWords":25}]},{"id":"p06","label":"2001","title":"Mon métier (Facteur)","passage":"Je vais vous étonner : oui, au niveau des relations, facteur, c'est très intéressant. Moi, maintenant, quand je fais ma tournée, j'ai des copains. Je ne suis pas seulement le facteur. Quand j'arrive, on dit : « Tiens, voilà Richard. » C'est formidable, non ? On se sent attendu. En milieu rural, nous sommes très utiles, surtout pour les personnes âgées. Parfois, il m'arrive d'être un confident pour des clients. Il y a des endroits où il n'y a que le facteur qui passe ; il devient quelqu'un d'important. Des déceptions ? Non je n'en ai pas. Par contre, les bonnes surprises, c'est qu'on est bien accueilli. Sauf parfois par les chiens ! C'est un métier qui peut être dangereux. J'ai pas mal de temps libre puisque je travaille de 6 heures à 13 heures. Mais c'est un boulot stressant. Dès qu'on part du bureau on ne pense qu'à la tournée, on rentre dans la voiture et on devient une machine. On a la responsabilité de 270 clients et quand on arrive au bureau, on pose la caisse et on fait ouf. Ce qui est pénible et répétitif, c'est d'entrer et de sortir sans cesse de la voiture, plus de 200 fois en trois heures et demie. À la fin on est une machine à donner le courrier. Il m'arrive parfois de m'arrêter à des endroits par habitude, même s'il n'y a pas de courrier à distribuer ! On croit que le facteur ne se fatigue pas. On dit souvent : PTT, Petit Travail Tranquille. Ce n'est pas vrai.","foot":"","qs":[{"text":"Est-ce que le facteur a des amis ?","marks":2.0,"t":"pr","model":"Oui, le facteur a des amis : il a des copains pendant sa tournée.","pts":[{"label":"friends","groups":[["copain","ami"]]}],"maxWords":29},{"text":"Est-il bien reçu par les gens ?","marks":2.0,"t":"pr","model":"Oui, il est bien reçu par les gens, sauf parfois par les chiens.","pts":[{"label":"yes\", welcome","groups":[["oui"],["accueil","recu"]]}],"maxWords":29},{"text":"Quels sont les inconvénients du métier de facteur ?","marks":2.0,"t":"pr","model":"Le métier est stressant, pénible et répétitif : il faut entrer et sortir sans cesse de la voiture et il peut être dangereux.","pts":[{"label":"disadvantages","groups":[["stress"],["dangereu"],["penible"],["repetitif"],["fatigu"]],"min":2}],"maxWords":45},{"text":"Quels sont les avantages de son métier ?","marks":1.5,"t":"pr","model":"Les avantages : le facteur a des copains, il se sent attendu, il est très utile surtout pour les personnes âgées et il a du temps libre.","pts":[{"label":"advantages","groups":[["copain"],["attendu"],["utile"],["libre"],["confident"],["accueil"]],"min":2}],"maxWords":52},{"text":"Expliquez le sens des expressions suivantes : a. On se sent attendu b. Quand on arrive au bureau, on pose la caisse et on fait ouf.","marks":2.5,"t":"op","model":"a. « On se sent attendu » veut dire que les gens attendent le facteur avec plaisir. b. « On pose la caisse et on fait ouf » veut dire qu'on est soulagé et qu'on se repose après le travail.","pts":[{"label":"meaning of a","groups":[["attend","content","plaisir","important","espere"]]},{"label":"meaning of b","groups":[["soulag","repos","fini","fatigu","termin","relax","respire"]]}],"maxWords":70}]},{"id":"p07","label":"2002","title":"Les familles françaises et le sport","passage":"Pendant l'année et surtout pendant les vacances, les hommes font plus de sport quand ils ont des enfants (51,6% des pères de deux enfants contre 47,7% d'hommes qui n'en ont pas). Les mères aussi, quand elles ont moins de trois enfants. Le sport est la première activité de loisirs chez les jeunes : 83% des moins de 18 ans font du sport au moins une fois par semaine. Mais ils ne pratiquent pas tous les mêmes sports : dans les familles les plus riches, on joue au tennis. À la campagne et dans les familles plus modestes, on joue au foot et on fait du vélo. 84% des familles pensent que le sport est important pour la personnalité et pour la santé. C'est aussi un bon exemple social et moral pour les enfants.","foot":"","qs":[{"text":"Est-ce que les pères font plus de sport que les autres hommes ?","marks":2.0,"t":"pr","model":"Oui, les pères font plus de sport que les autres hommes : 51,6 % des pères de deux enfants font du sport.","pts":[{"label":"yes","groups":[["oui"]]}],"maxWords":45},{"text":"Est-ce que les femmes sont plus sportives quand elles ont plus de trois enfants ?","marks":2.0,"t":"pr","model":"Non, les femmes sont plus sportives quand elles ont moins de trois enfants.","pts":[{"label":"no\" and fewer than three","groups":[["non"],["moin"]]}],"maxWords":29},{"text":"Quels types de sports sont pratiqués par les jeunes en France ?","marks":1.5,"t":"pr","model":"Les jeunes pratiquent le tennis, le foot et le vélo.","pts":[{"label":"the sports","groups":[["tennis"],["foot"],["velo"]],"min":2}],"maxWords":24},{"text":"Est-ce que le tennis est populaire à la campagne ?","marks":1.5,"t":"pr","model":"Non, le tennis n'est pas populaire à la campagne : à la campagne, on joue au foot et on fait du vélo.","pts":[{"label":"no\" and what instead","groups":[["non"],["foot","velo"]]}],"maxWords":43},{"text":"Pourquoi est-ce que la plupart des familles françaises aiment les sports ?","marks":1.5,"t":"pr","model":"La plupart des familles françaises aiment les sports parce qu'elles pensent que le sport est important pour la personnalité et pour la santé.","pts":[{"label":"the reason","groups":[["personnalite","sante"]]}],"maxWords":47},{"text":"Pourquoi est-ce que le sport est « un bon exemple social et moral pour les enfants » ?","marks":1.5,"t":"pr","model":"Le sport est un bon exemple social et moral pour les enfants parce qu'il est important pour la personnalité et pour la santé.","pts":[{"label":"the reason","groups":[["personnalite","sante","social","moral"]]}],"maxWords":47}]},{"id":"p08","label":"2003","title":"Les jeunes Français","passage":"La politique ? Non. Soixante et onze pour cent des 15–20 ans pensent qu'elle n'est pas très importante. La révolution ? Non plus. Ce pour quoi les jeunes expriment le plus d'enthousiasme, c'est la famille, le travail, l'amour et les voyages. « Mes parents, plus ça va, plus je les aime », déclarait récemment Philippe à la télévision. Si on leur demande de s'imaginer dans dix ans, la moitié des jeunes pensent connaître le chômage mais ils ressentent le chômage comme un événement inévitable, une sale période à traverser d'où ils sortiront. Ils travailleront 35 heures par semaine, auront un métier intéressant et un appartement confortable. Face à leur métier, ils sont réalistes : ils s'imaginent plus facilement ouvrier que chanteur. Le métier qui remporte tous les suffrages est celui de journaliste, suivi immédiatement par professeur et ingénieur. L'argent ? Soixante-quatre pour cent en mettent de côté pour s'acheter des vêtements, pour les sorties. Treize pour cent économisent pour l'avenir.","foot":"","qs":[{"text":"Est-ce que la révolution est très importante pour les jeunes Français ?","marks":1.5,"t":"pr","model":"Non, la révolution n'est pas très importante pour les jeunes Français.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":25},{"text":"Quels thèmes sont considérés importants par les jeunes ?","marks":1.5,"t":"pr","model":"Les jeunes pensent que la famille, le travail, l'amour et les voyages sont importants.","pts":[{"label":"the themes","groups":[["famille"],["travail"],["amour"],["voyage"]],"min":3}],"maxWords":31},{"text":"Est-ce que les jeunes Français sont optimistes ? Auront-ils un métier dans l'avenir ?","marks":2.0,"t":"op","model":"Oui, ils sont optimistes : ils auront un métier intéressant et un appartement confortable.","pts":[{"label":"optimistic","groups":[["oui","optimiste"]]},{"label":"a job","groups":[["metier","travailler","travailleront","auront","appartement"]]}],"maxWords":29},{"text":"Quelle profession est préférée par la plupart des jeunes ?","marks":1.5,"t":"pr","model":"La profession préférée de la plupart des jeunes est celle de journaliste.","pts":[{"label":"the job","groups":[["journaliste"]]}],"maxWords":27},{"text":"Comment est-ce que les enfants dépensent leur argent ?","marks":1.5,"t":"pr","model":"Les jeunes mettent de l'argent de côté pour s'acheter des vêtements et pour les sorties ; certains économisent pour l'avenir.","pts":[{"label":"the spending","groups":[["vetement","sortie","avenir","econom","mettent"]]}],"maxWords":40},{"text":"Expliquez le sens des expressions suivantes : a. Face à leur métier, ils sont réalistes. b. Treize pour cent économisent pour l'avenir.","marks":2.0,"t":"op","model":"a. Face à leur métier, ils sont réalistes : ils s'imaginent plus facilement ouvrier que chanteur. b. Treize pour cent des jeunes économisent pour l'avenir : ils mettent de l'argent de côté pour plus tard.","pts":[{"label":"meaning of a","groups":[["realiste","ouvrier","facilement","imagin","pratique","chanteur"]]},{"label":"meaning of b","groups":[["econom","avenir","epargn","cote","plus"],["tard"]]}],"maxWords":65}]},{"id":"p09","label":"2004","title":"La construction de l'Europe : 1945–1995","passage":"A la fin de la guerre, en 1945, l'Europe était dans une situation catastrophique. Il fallait tout reconstruire et réorganiser : les villes, les usines, les moyens de transport… L'Europe avait grand besoin de l'aide des Etats-Unis, mais elle avait aussi besoin de s'unir pour retrouver sa place et son influence dans le monde. Beaucoup de grands dirigeants souhaitaient que cette union se fasse vite ! En avril 1948, quatorze pays ont créé l'Organisation européenne de la coopération économique. La Grande-Bretagne n'en faisait pas partie. Le siège de l'OCDE (Organisation de coopération et de développement économiques), nom pris par cette organisation, est à Paris depuis sa création. Un an après, en mai 1949, dix pays ont signé un traité à Strasbourg. La Grande-Bretagne faisait partie du groupe. C'était le début du Conseil de l'Europe. Le 18 avril 1951, la Belgique, la France, l'Italie, le Luxembourg, les Pays-Bas et la RFA (République fédérale d'Allemagne) se sont réunis pour créer la communauté européenne du charbon et de l'acier (CECA). Mais ce n'est qu'en 1957, le 25 mars, que six pays de la CECA ont véritablement créé l'Europe. Le traité de Rome a institué la Communauté économique européenne (CEE) ou Marché commun. Le siège a été fixé à Bruxelles. En janvier 1963, la France a opposé son veto à l'entrée de la Grande-Bretagne dans le marché commun pour des raisons économiques et aussi politiques. En 1972, le général de Gaulle n'était plus là et le Royaume-Uni, le Danemark, l'Irlande ont pu enfin devenir membres de la CEE. Il a donc fallu 50 ans pour que les quinze pays de l'Europe de l'Ouest puissent unir leurs efforts et que les frontières soient ouvertes à la libre circulation des hommes et des marchandises. Le traité de Maastricht de mars 1993 a renforcé l'union économique de l'Europe, mais il reste à faire l'unité politique malgré les obstacles et à conserver les diversités culturelles !","foot":"","qs":[{"text":"Pourquoi est-ce que l'Europe était dans une situation difficile en 1945 ?","marks":1.0,"t":"imp","model":"En 1945, l'Europe était dans une situation difficile parce qu'il fallait tout reconstruire et réorganiser.","pts":[{"label":"the reason","groups":[["reconstruire","reorganiser","guerre","catastroph","detruit"]]}],"maxWords":33},{"text":"De qui et de quoi l'Europe avait-elle besoin ?","marks":2.0,"t":"imp","model":"L'Europe avait besoin de l'aide des États-Unis et elle avait besoin de s'unir.","pts":[{"label":"who","groups":[["etats","unis","amerique"]]},{"label":"what","groups":[["unir","union"]]}],"maxWords":31},{"text":"Quand et où a été créé l'OCDE ?","marks":2.0,"t":"pc","model":"L'OCDE a été créée en avril 1948 à Paris.","pts":[{"label":"when","groups":[["1948","avril"]]},{"label":"where","groups":[["paris"]]}],"maxWords":22},{"text":"Qui s'est opposé à l'entrée de la Grande-Bretagne dans le Marché commun ?","marks":1.0,"t":"pc","model":"La France (le général de Gaulle) s'est opposée à l'entrée de la Grande-Bretagne dans le Marché commun.","pts":[{"label":"who","groups":[["france","gaulle"]]}],"maxWords":38},{"text":"Qu'est-ce qui s'est passé en 1993 ?","marks":1.0,"t":"pc","model":"En mars 1993, le traité de Maastricht a renforcé l'union économique de l'Europe.","pts":[{"label":"what","groups":[["maastricht","traite","renforc"]]}],"maxWords":29},{"text":"Combien de temps a-t-il fallu pour arriver à ce résultat ?","marks":1.0,"t":"pc","model":"Il a fallu 50 ans pour arriver à ce résultat.","pts":[{"label":"how long","groups":[["50","cinquante"]]}],"maxWords":24},{"text":"Qu'est-ce qu'il reste à faire ?","marks":2.0,"t":"pr","model":"Il reste à faire l'unité politique et à conserver les diversités culturelles.","pts":[{"label":"political unity","groups":[["unite","politique"]]},{"label":"cultures","groups":[["diversit","cultur"]]}],"maxWords":27}]},{"id":"p10","label":"2005","title":"On ne sait jamais ce qu'on va faire le lendemain","passage":"Dimanche à Rouen, mardi au Danemark et vendredi au Maroc : Olivier Robert ne voyage pas seulement pour le plaisir. Il est cameraman indépendant et travaille vingt-cinq à trente jours par mois : « je ne voulais pas travailler pour une seule entreprise. Je voulais être libre. » Ce statut d'indépendant lui permet de changer d'employeur et de traiter des sujets très variés : de la violence à Paris au Congrès des politiciens. Il travaille pour France 2 mais aussi pour les producteurs américains ou japonais. Ses journées sont longues, douze heures en moyenne qui comprennent le temps nécessaire au transport et à la documentation. Parfois, Olivier est très fatigué. « Je travaille trop mais j'aime ça », dit Olivier. Ce qui est le plus pénible en fait, c'est l'incertitude : « On ne sait jamais ce qu'on va faire le lendemain. » Il est impossible de fixer des rendez-vous personnels car il faut être toujours disponible. Il est aussi difficile de consacrer du temps à sa famille. Il parle de sa fille qu'il ne voit jamais et des huit kilos de sa caméra. Il dit souvent : « Dans dix ans je passerai à autre chose. »","foot":"","qs":[{"text":"Quel est le métier d'Olivier ?","marks":1.5,"t":"pr","model":"Olivier est cameraman indépendant.","pts":[{"label":"the job","groups":[["cameraman"]]}],"maxWords":14},{"text":"Est-ce qu'il travaille pour une seule entreprise ?","marks":1.5,"t":"pr","model":"Non, il ne travaille pas pour une seule entreprise.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":22},{"text":"Combien de jours est-ce qu'il travaille par mois ?","marks":1.5,"t":"pr","model":"Il travaille vingt-cinq à trente jours par mois.","pts":[{"label":"how many","groups":[["vingt","25"],["trente","30"]]}],"maxWords":22},{"text":"Qu'est-ce qu'il aime dans son métier ?","marks":1.5,"t":"pr","model":"Il aime être libre : il aime changer d'employeur et traiter des sujets très variés.","pts":[{"label":"what he likes","groups":[["libre","employeur","sujet","varie"]]}],"maxWords":31},{"text":"Est-ce que tous les employeurs d'Olivier sont Européens ?","marks":1.0,"t":"pr","model":"Non, tous les employeurs d'Olivier ne sont pas européens : il travaille aussi pour des producteurs américains ou japonais.","pts":[{"label":"no\", others","groups":[["non"],["americain","japonais"]]}],"maxWords":38},{"text":"Pourquoi est-ce qu'Olivier se fatigue ?","marks":1.0,"t":"pr","model":"Olivier se fatigue parce que ses journées sont longues : douze heures en moyenne.","pts":[{"label":"the reason","groups":[["long","douze","12","heures"]]}],"maxWords":29},{"text":"Qu'est-ce qu'Olivier n'aime pas dans son métier ?","marks":1.0,"t":"pr","model":"Olivier n'aime pas l'incertitude : on ne sait jamais ce qu'on va faire le lendemain.","pts":[{"label":"what he dislikes","groups":[["incertitude","lendemain","sait","savoir","famille","disponible"]]}],"maxWords":31},{"text":"Que veut dire : « Dans dix ans, je passerai à autre chose ».","marks":1.0,"t":"pr","model":"Cela veut dire que, dans dix ans, Olivier va changer de métier et faire autre chose.","pts":[{"label":"the meaning","groups":[["autre","change","metier","arret"]]}],"maxWords":34}]},{"id":"p11","label":"2006","title":"Les jeux d'argent","passage":"En France, il existe plus de quinze jeux de loterie, et un Français sur deux y joue. Le plus célèbre est le Loto (on doit choisir des chiffres sur une grille), mais il y a aussi de nombreux jeux de « Grattage » (on doit gratter une case pour découvrir combien on a gagné). Ces jeux sont sous le contrôle de l'État et, en principe, ils sont interdits aux mineurs. Pourtant, les moins de 18 ans peuvent aussi acheter des tickets dans les cafés ou les bureaux de tabac — mais s'ils gagnent plus de 100 ou 200 francs, ils doivent venir avec leurs parents pour retirer l'argent. Que pensent les lycéens de ces jeux ? Adrien : Je n'en achète pas souvent, mais j'ai déjà gagné 200 francs. Les tickets, ce sont mes parents qui me les paient. Marie : Moi, je ne joue pas, mais c'est vrai que, avec toute cette publicité pour les jeux à la télé, on a envie d'essayer… Joseph : Mon grand-père, il joue tous les jours. Il perd beaucoup d'argent et il ne gagne presque rien. Moi, je ne ferai jamais ça !","foot":"","qs":[{"text":"Les jeux d'argent sont-ils pratiqués par les Français ?","marks":1.5,"t":"pr","model":"Oui, les jeux d'argent sont pratiqués par les Français : un Français sur deux y joue.","pts":[{"label":"yes","groups":[["oui"]]}],"maxWords":33},{"text":"Quels types de jeux sont très célèbres ?","marks":1.5,"t":"pr","model":"Le Loto et les jeux de grattage sont très célèbres.","pts":[{"label":"the games","groups":[["loto"],["grattage"]],"min":2}],"maxWords":24},{"text":"Dans quels cas est-ce que les enfants peuvent jouer aux jeux ?","marks":1.5,"t":"pr","model":"Les enfants peuvent jouer en achetant des tickets dans les cafés ou les bureaux de tabac, mais s'ils gagnent plus de 100 ou 200 francs, ils doivent venir avec leurs parents.","pts":[{"label":"the cases","groups":[["parent","gagnent","ticket","tabac","cafe"]]}],"maxWords":61},{"text":"Qui achète les tickets pour Adrien ?","marks":1.5,"t":"pr","model":"Ce sont les parents d'Adrien qui achètent les tickets.","pts":[{"label":"who","groups":[["parent"]]}],"maxWords":22},{"text":"Selon Marie, qu'est-ce qui pousse les enfants à jouer aux jeux ?","marks":1.5,"t":"pr","model":"Selon Marie, la publicité pour les jeux à la télé pousse les enfants à jouer.","pts":[{"label":"the cause","groups":[["publicite"]]}],"maxWords":33},{"text":"Le grand-père de Joseph, a-t-il gagné beaucoup d'argent ?","marks":1.5,"t":"pc","model":"Non, le grand-père de Joseph n'a pas gagné beaucoup d'argent : il a perdu beaucoup d'argent.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":34},{"text":"Est-ce que Joseph veut jouer aux jeux ?","marks":1.0,"t":"pr","model":"Non, Joseph ne veut pas jouer aux jeux.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":20}]},{"id":"p12","label":"2007","title":"Pourquoi préfère-t-on aujourd'hui le pain blanc ?","passage":"J'ai beaucoup d'admiration pour les boulangers et les pâtissiers. Je crois que c'est un des derniers bastions du travail artisanal et familial en France. En Amérique, presque tout le pain est fabriqué industriellement. En France, l'artisanat de la boulangerie a survécu, en partie grâce à la résistance opposée par l'exploitation familiale du four contre l'industrialisation qui la menace. Il ne faut pas oublier que le pain, le pain blanc était en France un symbole social. Au Moyen Âge, on mangeait du pain d'orge (barley). J'ai retrouvé en lisant 'Le chevalier au lion' de Chrétien de Troyes, au quinzième siècle, l'expression « grossier comme du pain d'orge » qu'on entendait encore dans le Languedoc, il n'y a pas longtemps. Mais dès le seizième siècle, on est passé au pain de froment (wheat) avec beaucoup de son ou au pain de seigle (rye), qu'on trouve toujours en Allemagne et en Russie. La bourgeoisie, la noblesse, la cour royale se distinguaient alors en mangeant du pain blanc. Aujourd'hui, nous nous symbolisons un peu par la voiture, la « Mercédès ». Autrefois, on se distinguait de bien de façons, mais d'abord par le pain. Le pain noir des serviteurs ou le pain blanc des maîtres.","foot":"","qs":[{"text":"Pourquoi le narrateur admire-t-il les boulangers et les pâtissiers ?","marks":1.0,"t":"pr","model":"Le narrateur admire les boulangers et les pâtissiers parce que c'est un des derniers bastions du travail artisanal et familial en France.","pts":[{"label":"the reason","groups":[["artisanal","familial","bastion","artisan"]]}],"maxWords":45},{"text":"Quelle est la différence dans la production du pain en Amérique et en France ?","marks":1.5,"t":"pr","model":"En Amérique, presque tout le pain est fabriqué industriellement, mais en France l'artisanat de la boulangerie survit.","pts":[{"label":"America","groups":[["industriel"]]},{"label":"France","groups":[["artisan","survit","survecu","familial"]]}],"maxWords":36},{"text":"Comment est-ce que l'artisanat de la boulangerie a survécu en France ?","marks":1.0,"t":"pc","model":"L'artisanat de la boulangerie a survécu en partie grâce à la résistance opposée par l'exploitation familiale du four contre l'industrialisation.","pts":[{"label":"how","groups":[["resistance","familial","four"]]}],"maxWords":42},{"text":"Pour les Français qu'est-ce que symbolisait le pain blanc ?","marks":1.0,"t":"imp","model":"Le pain blanc était un symbole social.","pts":[{"label":"the symbol","groups":[["social","symbole"]]}],"maxWords":18},{"text":"Comment le narrateur a-t-il découvert l'origine de l'expression « grossier comme du pain d'orge » ?","marks":1.0,"t":"pc","model":"Le narrateur a découvert l'origine de l'expression en lisant « Le chevalier au lion » de Chrétien de Troyes.","pts":[{"label":"how","groups":[["chevalier","lion","chretien","lisant","lu"]]}],"maxWords":36},{"text":"Quels changements ont eu lieu dans la production du pain ?","marks":1.0,"t":"pc","model":"Au Moyen Âge, on mangeait du pain d'orge ; dès le seizième siècle, on est passé au pain de froment ou au pain de seigle.","pts":[{"label":"the changes","groups":[["orge"],["froment","seigle"]]}],"maxWords":49},{"text":"Quelles classes sociales se distinguaient en mangeant du pain blanc ? Pourquoi ?","marks":1.5,"t":"imp","model":"La bourgeoisie, la noblesse et la cour royale se distinguaient en mangeant du pain blanc, parce que le pain blanc était un symbole social.","pts":[{"label":"which classes","groups":[["bourgeoisie","noblesse","cour"]]},{"label":"why","groups":[["symbole","distingu","social"]]}],"maxWords":49},{"text":"Comment faisait-on les distinctions autrefois ?","marks":1.0,"t":"imp","model":"Autrefois, on se distinguait de bien des façons, mais d'abord par le pain.","pts":[{"label":"how","groups":[["pain"]]}],"maxWords":29},{"text":"Quel est le rapport entre la Mercédès et le pain ?","marks":1.0,"t":"pr","model":"Aujourd'hui, nous nous distinguons un peu par la voiture, la Mercédès, comme autrefois par le pain.","pts":[{"label":"the link","groups":[["voiture","mercedes","symbol","distingu"]]}],"maxWords":34}]},{"id":"p13","label":"2008","title":"Portraits (L'instituteur, Le sapeur-pompier, Le boulanger)","passage":"L'instituteur : Tout le monde en a un, une (ou plusieurs) dans sa mémoire. L'instituteur, c'est pour les enfants, le premier contact avec la société extérieure en dehors du cercle familial. C'est aussi l'ouverture sur le monde du savoir. C'est un guide, souvent un modèle. Son image a évolué avec le temps. Même si la profession a perdu de son prestige, « l'insti » (comme on l'appelle) a une image très positive dans la société française. Le sapeur-pompier : Les sapeurs-pompiers sont aimés et admirés par des Français. Ils viennent sur simple appel téléphonique en cas d'incendie ou d'accident de la route. Ils assurent la sécurité dans les villages de France à l'occasion des manifestations populaires : fêtes et bal du 14 juillet. Le boulanger : Le boulanger est un personnage important dans les villages et les villes de France. Il est considéré comme un artiste. Même si les Français ne mangent pas aujourd'hui beaucoup de pain, ils n'hésitent pas à traverser la moitié de la ville, le dimanche matin, pour acheter le pain et les croissants que fabrique tel ou tel boulanger.","foot":"","qs":[{"text":"Le texte parle de combien de métiers ? Lesquels ?","marks":2.0,"t":"pr","model":"Le texte parle de trois métiers : l'instituteur, le sapeur-pompier et le boulanger.","pts":[{"label":"how many","groups":[["trois","3"]]},{"label":"which","groups":[["instituteur"],["pompier"],["boulanger"]]}],"maxWords":29},{"text":"Pourquoi est-ce qu'un instituteur est important pour les enfants ? Donnez deux raisons.","marks":2.0,"t":"pr","model":"L'instituteur est important parce qu'il est le premier contact avec la société extérieure et l'ouverture sur le monde du savoir.","pts":[{"label":"reason 1","groups":[["contact","exterieure"]]},{"label":"reason 2","groups":[["savoir","guide","modele","ouverture"]]}],"maxWords":42},{"text":"Que veut dire la phrase : « L'insti a une image très positive dans la société française. »","marks":1.5,"t":"op","model":"Cela veut dire que les Français aiment et admirent les instituteurs.","pts":[{"label":"the meaning","groups":[["aime","positive","admir","bonne","respect","apprecie","opinion","image"]]}],"maxWords":25},{"text":"Pourquoi les Français aiment-ils les sapeurs-pompiers ?","marks":1.5,"t":"pr","model":"Les Français aiment les sapeurs-pompiers parce qu'ils viennent sur simple appel téléphonique en cas d'incendie ou d'accident.","pts":[{"label":"the reason","groups":[["appel","incendie","accident","securite","viennent","aident"]]}],"maxWords":38},{"text":"Que font les sapeurs-pompiers pendant les fêtes populaires ?","marks":1.0,"t":"pr","model":"Pendant les fêtes populaires, les sapeurs-pompiers assurent la sécurité dans les villages.","pts":[{"label":"what they do","groups":[["securite"]]}],"maxWords":29},{"text":"Le boulanger est-il important pour les Français ? Pourquoi ?","marks":2.0,"t":"pr","model":"Oui, le boulanger est important pour les Français parce qu'il est considéré comme un artiste.","pts":[{"label":"yes","groups":[["oui"]]},{"label":"why","groups":[["artiste","traverser","pain","croissant"]]}],"maxWords":33}]},{"id":"p14","label":"2009","title":"La francophonie","passage":"Quelque 200 millions de personnes sur les cinq continents parlent le français. Sur la base de cette langue en partage, le mouvement francophone a donné naissance à une Organisation internationale de la Francophonie. La diversité culturelle et la solidarité sont aujourd'hui les principaux thèmes promus par la Francophonie. Utilisé d'abord par le géographe français Onésime Reclus en 1880, le mot « francophonie » désigne aujourd'hui à la fois un concept socio-linguistique et une entité géopolitique : l'ensemble des personnes pouvant s'exprimer en français et la structure institutionnelle qui rassemble les pays « ayant le français en partage » au sein de l'Organisation internationale de la Francophonie. Avec environ 200 millions de francophones dans le monde, le français est, avec l'anglais, l'une des deux seules langues parlées sur tous les continents. De fait, depuis la première pierre posée à Niamey en 1970, la constitution d'une Francophonie culturelle, économique puis politique a réuni beaucoup de pays. De 18 membres en 1970 à 70 membres et observateurs depuis 2008, la francophonie aujourd'hui n'est pas représentée majoritairement par l'Afrique comme auparavant, mais inclut des pays du monde entier.","foot":"","qs":[{"text":"Sur la base de quoi a-t-on fondé l'Organisation internationale de la francophonie ? Quels sont ses objectifs ?","marks":2.0,"t":"pc","model":"On a fondé l'Organisation sur la base de la langue française en partage ; ses principaux objectifs sont la diversité culturelle et la solidarité.","pts":[{"label":"the base","groups":[["langue","francais","partage"]]},{"label":"the aims","groups":[["diversite","solidarite"]]}],"maxWords":47},{"text":"Qui a inventé le terme « francophonie » et quand ?","marks":1.5,"t":"pc","model":"Le géographe français Onésime Reclus a inventé le terme « francophonie » en 1880.","pts":[{"label":"who","groups":[["reclus"]]},{"label":"when","groups":[["1880"]]}],"maxWords":27},{"text":"Que représente le mot « francophonie » aujourd'hui ?","marks":1.0,"t":"pr","model":"Aujourd'hui, le mot « francophonie » représente un concept socio-linguistique et une entité géopolitique.","pts":[{"label":"meaning","groups":[["socio","concept"],["entite","geopolitique"]]}],"maxWords":29},{"text":"Quelles sont les langues parlées sur tous les continents ?","marks":1.0,"t":"pr","model":"Le français et l'anglais sont les langues parlées sur tous les continents.","pts":[{"label":"the languages","groups":[["francais"],["anglais"]]}],"maxWords":27},{"text":"Où et quand est-ce qu'on a d'abord établi l'Organisation internationale de la francophonie ?","marks":1.5,"t":"pc","model":"On a d'abord établi l'Organisation à Niamey en 1970.","pts":[{"label":"where","groups":[["niamey"]]},{"label":"when","groups":[["1970"]]}],"maxWords":22},{"text":"Qu'est-ce qui a réuni beaucoup de pays dans l'Organisation internationale de la francophonie ?","marks":1.0,"t":"pc","model":"La constitution d'une Francophonie culturelle, économique puis politique a réuni beaucoup de pays.","pts":[{"label":"what united them","groups":[["cultur","economi","politi","constitution"]]}],"maxWords":29},{"text":"Combien de pays membres et observateurs participent à la francophonie aujourd'hui ?","marks":1.0,"t":"pr","model":"Soixante-dix pays membres et observateurs participent à la francophonie aujourd'hui.","pts":[{"label":"how many","groups":[["70","soixante"]]}],"maxWords":25},{"text":"Quel continent symbolisait la francophonie auparavant ?","marks":1.0,"t":"imp","model":"Auparavant, l'Afrique symbolisait la francophonie.","pts":[{"label":"which continent","groups":[["afrique"]]}],"maxWords":15}]},{"id":"p15","label":"2010","title":"Le premier mai","passage":"Le premier mai est la fête du travail : partout dans le monde, des manifestations sont organisées pour rappeler les luttes menées pour défendre les droits des travailleurs. Le premier mai 1886 des ouvriers américains qui ont réclamé que la journée de travail ne dépasse pas 8 heures, ont été tués par la police. Cette date est donc devenue le symbole des luttes pour l'amélioration des conditions de travail. De plus, en 1890, des manifestants parisiens ont défilé dans les rues pour indiquer que les 24 heures d'une journée doivent être partagées en trois : 8 heures pour le travail, 8 heures pour le sommeil et 8 heures pour la vie personnelle. À partir de 1936, le 1er mai est une journée où l'on ne travaille pas. Il y a environ 150 ans en France, les enfants commençaient à travailler dans les usines à partir de 8 ans. D'autres étaient employés dans les mines : leur petite taille leur permettait de se glisser dans les galeries les plus étroites… Les adultes, eux, travaillaient jusqu'à 18 heures par jour, dimanche compris. Peu à peu, des ouvriers se sont unis pour résister aux patrons et exiger des droits : ils ont ainsi créé des syndicats. Ils ont fait des grèves et parfois ont affronté la police qui, à l'époque, était souvent du côté des patrons. Au fil des années, les travailleurs ont obtenu des droits qui aujourd'hui profitent à tous : droit de partir en vacances, d'être aidé en cas de maladie, de se reposer le week-end… Ces droits nous semblent évidents. Pourtant, dans certains pays, les conditions de travail sont aussi pénibles que celles des ouvriers français il y a 150 ans. C'est pourquoi la fête du travail n'est pas seulement une célébration du passé. Elle nous rappelle aussi qu'aujourd'hui encore des hommes et des femmes se battent pour améliorer leurs conditions de travail.","foot":"","qs":[{"text":"Comment fête-t-on le premier mai ? Pourquoi ?","marks":2.0,"t":"pr","model":"On fête le premier mai avec des manifestations partout dans le monde, pour rappeler les luttes menées pour défendre les droits des travailleurs.","pts":[{"label":"how","groups":[["manifestation"]]},{"label":"why","groups":[["droit","lutte","travailleur"]]}],"maxWords":47},{"text":"Pourquoi fête-t-on le premier mai comme la fête du travail ?","marks":1.0,"t":"pr","model":"On fête le premier mai comme la fête du travail parce qu'en 1886 des ouvriers américains qui ont réclamé une journée de 8 heures ont été tués par la police ; cette date est devenue le symbole des luttes.","pts":[{"label":"the reason","groups":[["1886","ouvrier","americain","tue","police","symbole","8"]]}],"maxWords":74},{"text":"Pourquoi les Parisiens ont-ils manifesté en 1890 ?","marks":1.0,"t":"pc","model":"Les Parisiens ont manifesté en 1890 pour indiquer que les 24 heures d'une journée doivent être partagées en trois : 8 heures pour le travail, 8 heures pour le sommeil et 8 heures pour la vie personnelle.","pts":[{"label":"the reason","groups":[["trois","huit","8","partag"]]}],"maxWords":70},{"text":"Quelle était la condition des enfants et des adultes en France dans les années 1800 ?","marks":2.0,"t":"imp","model":"Dans les années 1800, les enfants commençaient à travailler dans les usines à partir de 8 ans et les adultes travaillaient jusqu'à 18 heures par jour, dimanche compris.","pts":[{"label":"children","groups":[["usine","mine","huit","8"]]},{"label":"adults","groups":[["18","dix huit","dimanche"]]}],"maxWords":56},{"text":"Pourquoi a-t-on créé des syndicats et que faisaient ces syndicats ?","marks":2.0,"t":"op","model":"On a créé des syndicats pour résister aux patrons et exiger des droits ; les syndicats faisaient des grèves et affrontaient parfois la police.","pts":[{"label":"why","groups":[["resister","exiger","patron","droit"]]},{"label":"what they did","groups":[["greve","police","affront"]]}],"maxWords":47},{"text":"Quels avantages ont les travailleurs aujourd'hui ?","marks":1.0,"t":"pr","model":"Les travailleurs ont aujourd'hui le droit de partir en vacances, d'être aidés en cas de maladie et de se reposer le week-end.","pts":[{"label":"the advantages","groups":[["vacances"],["maladie"],["week"],["repos"]],"min":2}],"maxWords":47},{"text":"Pourquoi cette fête est-elle importante même aujourd'hui ?","marks":1.0,"t":"pr","model":"Cette fête est importante même aujourd'hui parce que, dans certains pays, les conditions de travail sont aussi pénibles qu'il y a 150 ans et que des hommes et des femmes se battent pour améliorer leurs conditions de travail.","pts":[{"label":"the reason","groups":[["pays","penible","battent","ameliorer","condition","rappelle"]]}],"maxWords":74}]},{"id":"p16","label":"2011","title":"Le métier d'un journaliste","passage":"Si vous voulez devenir journaliste, vous avez le choix, car la presse est multiple. Chaque moyen d'information a sa particularité et le journaliste doit pouvoir s'y adapter. À la radio on vous demandera d'être rapide pour suivre, minute par minute, l'actualité. Vous aurez le plaisir d'être le premier à raconter. La presse quotidienne nationale est aussi un autre moyen d'information très populaire. Elle comprend surtout des enquêtes et des reportages. Ainsi, un journaliste du Monde, du Figaro ou de Libération doit être capable de faire de la recherche. Devant tant de moyens d'information, le lecteur se sent parfois désorienté, il a du mal à faire la synthèse. Dans les années 60, une nouvelle forme de presse s'est développée. Ce sont les news magazines comme l'Express, le Point ou le Nouvel Observateur qui présentent une synthèse des événements de la semaine passée. Cette forme de presse a ses exigences : le journaliste étudie bien son sujet, essaie d'aller plus loin que le quotidien dans l'analyse. Le succès des news magazines correspond à une évolution de notre société. Leurs lecteurs sont déjà très informés, ils veulent comprendre le sens occupants des événements.","foot":"","qs":[{"text":"Qu'est-ce que vous entendez par l'expression : « La presse est multiple » ?","marks":1.5,"t":"op","model":"« La presse est multiple » veut dire qu'il y a plusieurs moyens d'information et que chacun a sa particularité.","pts":[{"label":"the meaning","groups":[["plusieurs","different","vari","moyens","choix"]]}],"maxWords":38},{"text":"Quelles sont les qualités d'un journaliste qui travaille pour la radio ?","marks":1.5,"t":"pr","model":"Un journaliste de radio doit être rapide pour suivre l'actualité minute par minute.","pts":[{"label":"the quality","groups":[["rapide"]]}],"maxWords":29},{"text":"Quels sont les quotidiens nationaux de France ?","marks":1.0,"t":"pr","model":"Les quotidiens nationaux de France sont Le Monde, Le Figaro et Libération.","pts":[{"label":"the names","groups":[["monde"],["figaro"],["liberation"]]}],"maxWords":27},{"text":"Quelles sont les compétences d'un journaliste qui rédige pour les quotidiens ?","marks":1.0,"t":"pr","model":"Un journaliste qui rédige pour les quotidiens doit être capable de faire de la recherche.","pts":[{"label":"the skill","groups":[["recherche","enquete","reportage"]]}],"maxWords":33},{"text":"Nommez trois titres des news magazines.","marks":1.0,"t":"op","model":"Trois titres de news magazines sont l'Express, le Point et le Nouvel Observateur.","pts":[{"label":"the titles","groups":[["express"],["point"],["observateur"]]}],"maxWords":29},{"text":"Quelles sont les caractéristiques des news magazines ?","marks":1.0,"t":"pr","model":"Les news magazines présentent une synthèse des événements de la semaine passée ; le journaliste étudie bien son sujet et va plus loin dans l'analyse.","pts":[{"label":"the features","groups":[["synthese","analyse","sujet","semaine"]]}],"maxWords":49},{"text":"Que fait le journaliste des news magazines ?","marks":1.0,"t":"pr","model":"Le journaliste des news magazines étudie bien son sujet et essaie d'aller plus loin que le quotidien dans l'analyse.","pts":[{"label":"what he does","groups":[["etudie","analyse","sujet","plus"],["loin"]]}],"maxWords":40},{"text":"Comment sont les lecteurs des news magazines ?","marks":1.0,"t":"pr","model":"Les lecteurs des news magazines sont déjà très informés ; ils veulent comprendre le sens des événements.","pts":[{"label":"the readers","groups":[["informe","comprendre","sens"]]}],"maxWords":34},{"text":"Existait-il des news magazines dans les années 50 ?","marks":1.0,"t":"imp","model":"Non, il n'existait pas de news magazines dans les années 50.","pts":[{"label":"no","groups":[["non"]]}],"maxWords":25}]},{"id":"p17","label":"2012","title":"Stéphane, reporteur-explorateur","passage":"Après ses études de médecine, les parents de Stéphane espéraient que leur fils deviendrait médecin. Stéphane, lui, avait une autre idée. Il voulait voyager. Aujourd'hui, il a trente-deux ans. Il a enfin la chance de faire le métier qu'il a toujours voulu faire : il est reporteur-explorateur. Son travail consiste à découvrir les pays peu connus et d'écrire des articles sur ces pays. Il écrit dans des guides ou des magazines pour renseigner les gens qui vont voyager dans ces pays. Beaucoup de jeunes rêvent d'être reporteur-explorateur mais ils oublient que le travail de Stéphane n'est pas facile. Alors, comment Stéphane a-t-il pu réaliser ce rêve ? Pourquoi a-t-il été choisi par le magazine 'Terres Inconnues' pour écrire son premier reportage sur les Yanomani, un peuple du Brésil ? « Parmi tous les candidats », dit Stéphane, « je pensais qu'on choisirait un journaliste, ou quelqu'un qui avait fait de nombreux voyages. Eh bien, non, c'est moi qu'ils ont choisi parce que je parlais portugais couramment. J'ai accompagné un groupe d'alpinistes dans l'Himalaya. Le magazine voulait un article sur les problèmes de santé en haute montagne. On ne m'a pas choisi parce que j'avais l'expérience de la haute montagne. Non, cette fois, on m'a choisi parce que j'étais médecin ! » Aujourd'hui, quand il n'est pas en voyage pour ses reportages, Stéphane continue à apprendre : la mécanique, la photographie. Tout l'intéresse. Aux jeunes qui veulent faire le même travail que lui, Stéphane donne le conseil suivant : « Ne perdez jamais votre temps : il est précieux ! Il y a toujours tellement de choses à apprendre et à découvrir. Servez-vous des livres, des magazines, de l'Internet. C'est important de pouvoir faire le maximum de choses seul, sans avoir besoin de l'aide des autres. Alors, vous pourrez vraiment choisir le métier que vous aimez. »","foot":"","qs":[{"text":"D'après le narrateur, qu'est-ce qui s'est passé après les études de médecine de Stéphane ?","marks":1.0,"t":"imp","model":"Après ses études de médecine, les parents de Stéphane espéraient qu'il deviendrait médecin, mais il voulait voyager.","pts":[{"label":"what happened","groups":[["medecin","voyag"]]}],"maxWords":36},{"text":"Stéphane, que voulait-il toujours faire dans la vie ?","marks":1.0,"t":"imp","model":"Stéphane voulait toujours voyager.","pts":[{"label":"what he wanted","groups":[["voyager"]]}],"maxWords":14},{"text":"De quoi consiste son travail ?","marks":1.0,"t":"pr","model":"Son travail consiste à découvrir les pays peu connus et à écrire des articles sur ces pays.","pts":[{"label":"his work","groups":[["decouvr","ecri","article","pays"]]}],"maxWords":36},{"text":"Où écrit-il et pour qui écrit-il ?","marks":1.0,"t":"pr","model":"Il écrit dans des guides ou des magazines pour renseigner les gens qui vont voyager dans ces pays.","pts":[{"label":"where","groups":[["guide","magazine"]]},{"label":"for whom","groups":[["renseign","voyag","gens"]]}],"maxWords":38},{"text":"Quel était le premier article de Stéphane et pour quel magazine l'a-t-il écrit ?","marks":1.0,"t":"op","model":"Son premier article était sur les Yanomani, un peuple du Brésil, et il l'a écrit pour le magazine Terres Inconnues.","pts":[{"label":"the article","groups":[["yanomani"]]},{"label":"the magazine","groups":[["terres","inconnues"]]}],"maxWords":42},{"text":"Est-ce que Stéphane espérait avoir le poste de reporteur dans le magazine Terres Inconnues ? Qui, selon lui, aurait été le choix naturel pour ce poste ?","marks":1.0,"t":"op","model":"Non, il pensait qu'on choisirait un journaliste, ou quelqu'un qui avait fait de nombreux voyages.","pts":[{"label":"no","groups":[["non"]]},{"label":"who","groups":[["journaliste","voyages"]]}],"maxWords":33},{"text":"Pourquoi avait-on choisi Stéphane pour faire ce premier article ?","marks":1.0,"t":"pc","model":"On a choisi Stéphane parce qu'il parlait portugais couramment.","pts":[{"label":"the reason","groups":[["portugais"]]}],"maxWords":22},{"text":"Que fait-il aujourd'hui quand il ne voyage pas ?","marks":1.0,"t":"pr","model":"Aujourd'hui, quand il ne voyage pas, Stéphane continue à apprendre : la mécanique, la photographie.","pts":[{"label":"what he does","groups":[["apprendre","mecanique","photographie"]]}],"maxWords":31},{"text":"Quel conseil donne-t-il aux jeunes ?","marks":1.0,"t":"pr","model":"Il donne le conseil suivant : ne perdez jamais votre temps, il y a toujours tellement de choses à apprendre et à découvrir.","pts":[{"label":"the advice","groups":[["temps","apprendre","decouvrir","perd"]]}],"maxWords":45},{"text":"Comment arriverait-on à choisir le métier qu'on aime, d'après Stéphane ?","marks":1.0,"t":"cond","model":"On arriverait à choisir le métier qu'on aime en faisant le maximum de choses seul, sans avoir besoin de l'aide des autres.","pts":[{"label":"how","groups":[["seul","maximum","aide","livres","apprendre","choses"]]}],"maxWords":45}]},{"id":"p18","label":"2013","title":"Une grande fête pour 50 000 enfants","passage":"Chaque année, un enfant sur trois passe tout l'été chez lui. Ces enfants ne vont pas en vacances. Leurs parents ne peuvent pas quitter leur emploi et n'ont pas les moyens d'envoyer leurs enfants dans des centres de vacances. Depuis 1979, le Secours Populaire, une association charitable, essaie chaque été d'organiser des excursions au bord de la mer ou des visites dans des parcs d'attractions pour donner la chance à ces enfants de voyager un peu, de ne pas rester tout l'été à la maison. Cette année, les organisateurs de Secours Populaire ont donné à cette journée exceptionnelle le nom de « Journée Soleil ». Le matin, dans toute la France, des centaines d'enfants entre l'âge de six à douze ans, se sont levés très tôt pour prendre le bus ou l'avion. Les organisateurs avaient réservé six trains spéciaux et sept cent bus dans toute la France pour les emmener à Paris. Là, les enfants ont passé la journée à découvrir la ville. La matinée est réservée aux monuments principaux de la capitale. Pendant les visites, les enfants étaient accompagnés par des guides parisiens qui donnaient beaucoup d'explications sur chaque monument. Et puis, c'est l'heure de la pause. Avec des centaines d'autres enfants, Fabien est assis sur les pelouses au pied de la Tour Eiffel. Là, un immense pique-nique est servi aux enfants des bénévoles. « Moi, j'attends surtout l'après-midi » dit Fabien. « Nous allons tous au Stade de France. C'est là que l'Équipe de France a gagné la coupe du monde en 1998. Je voudrais tellement le voir, ce stade. En plus, on nous a dit que Zinedine Zidane allait venir ! Ça serait vraiment super ! » Vers 18 heures, les enfants ont repris les trains et les cars qui les ramenaient chez eux. La plupart se sont endormis, épuisés mais ravis de cette journée.","foot":"","qs":[{"text":"Pourquoi quelques enfants ne vont-ils pas en vacances ?","marks":2.0,"t":"pr","model":"Quelques enfants ne vont pas en vacances parce que leurs parents ne peuvent pas quitter leur emploi et n'ont pas les moyens de les envoyer dans des centres de vacances.","pts":[{"label":"the reason","groups":[["emploi","moyens","parents"]]}],"maxWords":60},{"text":"Le Secours Populaire, qu'est-ce qu'il essaie de faire ? Pourquoi ?","marks":2.5,"t":"pr","model":"Le Secours Populaire essaie d'organiser des excursions au bord de la mer ou des visites dans des parcs d'attractions pour donner la chance à ces enfants de voyager un peu.","pts":[{"label":"what","groups":[["excursion","visite","organis"]]},{"label":"why","groups":[["chance","voyager"]]}],"maxWords":60},{"text":"Quels préparatifs les organisateurs font-ils pour emmener les enfants à Paris ?","marks":2.5,"t":"pr","model":"Les organisateurs réservent six trains spéciaux et sept cents bus dans toute la France pour emmener les enfants à Paris.","pts":[{"label":"trains","groups":[["train"]]},{"label":"buses","groups":[["bus"]]}],"maxWords":42},{"text":"Que font les enfants à l'heure de la pause ?","marks":1.5,"t":"pr","model":"À l'heure de la pause, les enfants font un immense pique-nique sur les pelouses au pied de la tour Eiffel.","pts":[{"label":"what they do","groups":[["pique","pelouse","eiffel","mang"]]}],"maxWords":43},{"text":"Pourquoi Fabien attend-il l'après-midi ?","marks":1.5,"t":"pr","model":"Fabien attend l'après-midi parce qu'ils vont tous au Stade de France et qu'il veut tellement le voir.","pts":[{"label":"the reason","groups":[["stade","zidane"]]}],"maxWords":38}]},{"id":"p19","label":"2014","title":"L'Abbé Pierre","passage":"Quand on demande aux Français quelle est la personne qu'ils préfèrent, ils répondent en majorité 'L'Abbé Pierre'. Qui est cet Abbé Pierre dont on entend parler depuis 1954 ? Henri Gouès est son vrai nom. Il est né en 1912 et il est devenu prêtre en 1931. Pendant la Deuxième Guerre Mondiale il devait se cacher et changer son nom : il est devenu l'Abbé Pierre. Après la guerre, les maisons étaient détruites et beaucoup de gens étaient sans logement — on appelait ces gens les 'sans-logis'. Touché par leur misère, l'
