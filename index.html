Abbé Pierre a décidé de mettre toute son énergie pour les aider. Alors il a créé en 1949 le premier 'Centre Emmaüs' où il a accueilli les personnes sans-logis et les a aidés à trouver un logement. En 1954, l'hiver était très froid. Une femme et un bébé sont morts de froid à Paris sur le trottoir. Révolté, l'Abbé Pierre a décidé de faire réagir la population. Il est allé à la radio et il a pris la parole pour demander à tous les Français d'aider les 'sans-logis'. La réponse était immédiate : on a téléphoné pour proposer des logements vides. Des centaines de gens ont apporté des tentes, des vêtements, des couvertures et de la nourriture. Des dizaines de personnes sont venues se joindre à l'Abbé Pierre et à l'association Emmaüs. Depuis le premier succès de ce premier appel, l'Abbé Pierre a continué à aider les personnes les plus pauvres de la société et les 'sans-logis'. En 2004, cinquante ans après son premier appel, l'Abbé Pierre est encore revenu à la radio pour demander de nouveau à la population de montrer leur générosité, de ne pas oublier les pauvres, ceux qui n'avaient même pas de logement. À l'âge de quatre-vingt-treize ans, l'Abbé Pierre a gardé le même enthousiasme et la même générosité qu'il avait à vingt ans. C'est sans doute pourquoi les Français l'aiment tant.","foot":"","qs":[{"text":"Décrivez comment et pourquoi Henri Gouès est devenu l'Abbé Pierre.","marks":2.5,"t":"pc","model":"Pendant la Deuxième Guerre mondiale, Henri Gouès devait se cacher et changer son nom : il est devenu l'Abbé Pierre.","pts":[{"label":"how","groups":[["guerre","cacher"]]},{"label":"what he changed","groups":[["changer","nom"]]}],"maxWords":40},{"text":"Qu'est-ce qui a poussé l'Abbé Pierre à créer le centre Emmaüs ?","marks":2.0,"t":"pc","model":"Touché par la misère des sans-logis, l'Abbé Pierre a décidé de les aider.","pts":[{"label":"the reason","groups":[["misere","logis","logement","aider","detruit"]]}],"maxWords":31},{"text":"Que fait le centre Emmaüs pour aider les gens ? Donnez-en un exemple.","marks":2.5,"t":"pr","model":"Le centre Emmaüs accueille les personnes sans-logis et les aide à trouver un logement.","pts":[{"label":"welcomes","groups":[["accueill"]]},{"label":"helps","groups":[["aide","logement"]]}],"maxWords":33},{"text":"Qu'est-ce qui montre que la population était touchée par le message de l'Abbé Pierre ?","marks":1.5,"t":"op","model":"Des centaines de gens ont apporté des tentes, des vêtements, des couvertures et de la nourriture.","pts":[{"label":"the proof","groups":[["telephon","logement","tente","vetement","couverture","nourriture","apporte"]]}],"maxWords":34},{"text":"Quelles sont les deux grandes qualités qui caractérisent l'Abbé Pierre ?","marks":1.5,"t":"pr","model":"Les deux grandes qualités de l'Abbé Pierre sont l'enthousiasme et la générosité.","pts":[{"label":"the qualities","groups":[["enthousiasme"],["generosite"]]}],"maxWords":27}]},{"id":"p20","label":"2015 (official)","title":"Louis Braille","passage":"Louis Braille est connu dans le monde entier. C'est lui qui a inventé un système d'écriture qui permet aux aveugles de lire. Louis Braille est né en 1809 à Coupvray, un petit village de France situé à l'est de Paris. À l'âge de trois ans, en jouant avec un couteau, Louis s'est gravement blessé à un œil. Les médecins, qui à cette époque ne comprenaient pas bien les problèmes d'infection, n'ont pas bien soigné le petit Louis. Alors, peu de temps après l'accident, il a perdu la vue dans les deux yeux. Cependant, Louis a refusé d'être découragé : il est devenu un brillant élève à l'école du village. À l'âge de dix ans, suivant les conseils de son professeur, il a quitté l'école du village pour aller dans une école spécialisée à Paris. Là, les enfants aveugles comme Louis pouvaient recevoir une excellente éducation. Élève travailleur et déterminé, Louis a réussi à toutes les matières. Louis a passé vingt-quatre ans dans cet établissement, d'abord comme élève, puis comme enseignant. C'est là qu'il a développé son célèbre système d'écriture qui allait permettre aux enfants aveugles de lire et d'apprendre. D'autres systèmes existaient déjà mais pour Louis, ces systèmes étaient trop compliqués. Dans le système Braille, l'enfant aveugle apprend à « lire » avec les doigts. « Le système Braille a transformé la vie des enfants aveugles », déclare le Professeur Dubois, spécialiste d'enseignement. « Ce système est à la fois simple et efficace : je suis sûr qu'il a permis à des générations d'enfants de découvrir le monde de la connaissance. »","foot":"","qs":[{"text":"Le petit Louis, comment est-il devenu aveugle ?","marks":2.0,"t":"pc","model":"Louis est devenu aveugle parce qu'en jouant avec un couteau à l'âge de trois ans, il s'est gravement blessé à un œil.","pts":[{"label":"how","groups":[["couteau","blesse","oeil","accident"]]}],"maxWords":45},{"text":"Comment a-t-il réagi après son accident ?","marks":2.0,"t":"pc","model":"Louis a refusé d'être découragé : il est devenu un brillant élève à l'école du village.","pts":[{"label":"his reaction","groups":[["refuse","decourage","brillant","eleve"]]}],"maxWords":33},{"text":"Qu'est-ce qui montre que Louis travaillait bien à l'école à Paris ?","marks":2.0,"t":"op","model":"Louis était un élève travailleur et déterminé : il a réussi à toutes les matières.","pts":[{"label":"the proof","groups":[["reussi","matieres","travailleur","determine"]]}],"maxWords":31},{"text":"Qu'est-ce qu'il a fait pendant les vingt-quatre ans qu'il a passés dans le même établissement scolaire ?","marks":2.5,"t":"pc","model":"Pendant ces vingt-quatre ans, Louis a été d'abord élève, puis enseignant, et il a développé son célèbre système d'écriture.","pts":[{"label":"his roles","groups":[["eleve"],["enseignant"]]},{"label":"his invention","groups":[["developpe","systeme","ecriture"]]}],"maxWords":42},{"text":"Selon le Professeur Dubois, le système Braille, comment a-t-il transformé la vie des enfants aveugles ?","marks":1.5,"t":"pc","model":"Selon le Professeur Dubois, le système Braille a transformé la vie des enfants aveugles parce qu'il est à la fois simple et efficace : il a permis à des générations d'enfants de découvrir le monde de la connaissance.","pts":[{"label":"how","groups":[["simple","efficace","decouvrir","connaissance"]]}],"maxWords":72}]},{"id":"p21","label":"2016","title":"Edith Piaf","passage":"Edith Piaf, née le 19 décembre 1915 à Paris et morte le 10 octobre 1963 à Grasse, était une chanteuse française. Née dans la misère, Edith Piaf est la fille de Louis Alphonse Gassion, artiste de cirque, et d'Annella, chanteuse de rue. Sa mère, très pauvre, l'abandonne pour gagner sa vie. Sa grand-mère maternelle ne s'occupe pas d'elle, laissant la petite fille dans la saleté. Après 18 mois, son père la confie à sa grand-mère paternelle, avant de repartir au front. Maintenant sa vie est confortable, portant de jolies robes et mangeant bien. En 1922, son père la prend avec lui pour vivre la vie d'artiste de petits cirques. En 1930, elle quitte son père et chante en duo dans la rue avec Simone Berteaut, qui devient son amie. En automne 1935, elle est découverte dans la rue par Louis Leplée, gérant du cabaret 'Le Gerny's' sur les Champs-Élysées. Il lui choisit comme nom d'artiste 'La Môme Piaf' (un 'piaf' familièrement est un moineau [a sparrow]). Le succès arrive. En 1936, elle enregistre son premier disque, Les Mômes de la Cloche. Elle a un grand succès public. Mais en avril, on trouve Leplée assassiné chez lui à Paris. Cela précipite Edith dans le scandale. Elle risque de retourner d'où elle est venue : la rue et la misère. Puis Raymond Asso devient son nouveau mentor et Edith devient une chanteuse professionnelle de music-hall. Maintenant elle est vedette de la chanson française.","foot":"","qs":[{"text":"Décrivez l'enfance d'Edith Piaf.","marks":2.0,"t":"op","model":"Née dans la misère, Edith est la fille d'un artiste de cirque et d'une chanteuse de rue ; sa mère l'abandonne et sa grand-mère maternelle la laisse dans la saleté, puis sa vie devient confortable chez sa grand-mère paternelle.","pts":[{"label":"her childhood","groups":[["misere"],["abandon"],["grand mere"],["cirque"],["salete"],["confortable"]],"min":2}],"maxWords":78},{"text":"Elle chante pour la première fois quand et avec qui ?","marks":3.0,"t":"pr","model":"Elle chante pour la première fois en 1930, dans la rue, avec Simone Berteaut.","pts":[{"label":"when","groups":[["1930"]]},{"label":"with whom","groups":[["simone","berteaut"]]}],"maxWords":31},{"text":"Qui lui donne le nom « Piaf » et pourquoi ?","marks":2.5,"t":"pr","model":"Louis Leplée lui donne le nom « Piaf » parce qu'un « piaf » est familièrement un moineau.","pts":[{"label":"who","groups":[["leplee"]]},{"label":"why","groups":[["moineau"]]}],"maxWords":31},{"text":"Décrivez la carrière d'Edith Piaf après la mort de Leplée.","marks":2.5,"t":"op","model":"Après la mort de Leplée, Raymond Asso devient son mentor et Edith devient une chanteuse professionnelle de music-hall, puis une vedette de la chanson française.","pts":[{"label":"who helped","groups":[["asso","mentor"]]},{"label":"her career","groups":[["professionnelle","music hall","vedette"]]}],"maxWords":52}]},{"id":"p22","label":"2017","title":"Catherine : la vie en pension","passage":"Les élèves qui habitent loin de l'école et qui ne peuvent pas rentrer chez eux chaque soir doivent rester à l'école. Ils sont donc « pensionnaires ». Par contre, pour Catherine, aller en pension a été son propre choix. Elle n'avait ni frères ni sœurs et elle s'ennuyait un peu, seule chez elle. De plus, elle était un peu timide. Alors, le meilleur moyen de se faire des amis était de vivre à l'école pendant tout le trimestre, avec un groupe de jeunes de son âge. Ses parents ont trouvé une école avec pensionnat pour elle. Elle y est entrée à l'âge de treize ans. Ses parents étaient bien tristes de la voir partir. Les premiers jours ont été difficiles : Catherine ne connaissait personne. Les autres élèves avaient déjà leurs amis. Pendant les repas, elle mangeait seule. De plus, elle avait du mal à s'habituer aux règles de l'école. Chez elle, Catherine aimait lire le soir au lit. Mais au pensionnat, pas de lumières dans les dortoirs après dix heures. « Quand mes parents me téléphonaient, je leur disais que j'étais très heureuse », dit-elle. « J'avais choisi cette vie. Je devais donc rester au pensionnat ! » Et puis, une nouvelle élève, Carole, est arrivée. Elle venait d'une île tropicale. « Alors, bien sûr, elle avait toujours froid », raconte Catherine. « Je lui ai prêté un pull en laine et de grosses chaussures. Après, on est devenu les meilleures amies du monde. » À deux, elles se sentaient plus fortes et elles se sont fait d'autres amies. « En pension », déclare Catherine, « j'ai appris à écouter et comprendre les autres. Mais maintenant, je ne peux plus rester seule et ça, c'est un problème ! »","foot":"","qs":[{"text":"Catherine, pourquoi voulait-elle aller en pension ?","marks":2.0,"t":"imp","model":"Catherine voulait aller en pension parce qu'elle n'avait ni frères ni sœurs, elle s'ennuyait seule et elle voulait se faire des amis.","pts":[{"label":"the reason","groups":[["amis","seule","ennuy","timide","frere"]]}],"maxWords":45},{"text":"Quels problèmes avait-elle pendant les premiers jours ?","marks":3.0,"t":"imp","model":"Pendant les premiers jours, Catherine ne connaissait personne, elle mangeait seule et elle avait du mal à s'habituer aux règles de l'école.","pts":[{"label":"alone","groups":[["seule","connaissait"]]},{"label":"rules","groups":[["regle","habituer","lumiere","dortoir"]]}],"maxWords":45},{"text":"Pendant ses premiers jours au pensionnat, quel message a-t-elle voulu transmettre à ses parents ? Pourquoi ?","marks":3.0,"t":"op","model":"Elle disait à ses parents qu'elle était très heureuse parce qu'elle avait choisi cette vie et qu'elle devait donc rester au pensionnat.","pts":[{"label":"the message","groups":[["heureuse"]]},{"label":"why","groups":[["choisi","rester"]]}],"maxWords":45},{"text":"Comment la situation a-t-elle changé ?","marks":2.0,"t":"pc","model":"La situation a changé quand une nouvelle élève, Carole, est arrivée : elles sont devenues les meilleures amies du monde.","pts":[{"label":"what changed","groups":[["carole","amie"]]}],"maxWords":40}]},{"id":"p23","label":"2018","title":"Des journées pas chères","passage":"Cette année, comme l'an dernier, la Normandie, une région au nord de la France, organise pour ses habitants l'opération « Journée-Mer ». Les Normands peuvent prendre le train vers la mer et les plages pour le tarif exceptionnel d'un euro seulement. Cette opération, qui se déroule pendant les grandes vacances scolaires, commence le premier juillet et termine le trente août. « Cette opération est un véritable succès », déclare le 10 août Monsieur Vatrin, organisateur de l'opération « Journée-Mer ». « Presque 100 000 personnes ont pris le train le week-end dernier pour aller à la plage. C'est à refaire. » Pour bénéficier de ce prix spécial, il suffit d'acheter, pour cinq euros, la carte « Journée-Mer » dans une gare SNCF. En effet, une seule carte permet à cinq personnes de payer le tarif d'un euro. Nicole, qui habite Rouen, une grande ville de la Normandie, est partie tous les week-ends à la plage avec son mari et ses trois enfants. « Avant, on voyageait toujours en voiture parce que le train était trop cher pour nous. Mais cette année, j'ai acheté la carte 'Journée-Mer', alors on n'a pas hésité à prendre le train », raconte Nicole. « Pendant le voyage en train, on peut lire des histoires aux enfants ou jouer à des jeux ensemble. C'est vraiment super ! » Une nouveauté cette année : il est possible de louer un vélo à la gare d'arrivée pour le prix de trois euros par jour seulement et sur présentation de la carte « Journée-Mer » bien sûr. Mais attention, les trains sont souvent pleins. Alors pour être sûr de partir quand vous le désirez, nous vous recommandons de faire une réservation au moins dix jours avant votre départ.","foot":"","qs":[{"text":"Que veut dire l'opération « Journée-Mer » ?","marks":2.0,"t":"pr","model":"L'opération « Journée-Mer » veut dire que les Normands peuvent prendre le train vers la mer et les plages pour un euro seulement.","pts":[{"label":"the meaning","groups":[["train","euro","plage","mer"]]}],"maxWords":45},{"text":"Qu'est-ce qu'on doit faire pour bénéficier du prix spécial ?","marks":2.0,"t":"pr","model":"Pour bénéficier du prix spécial, on doit acheter, pour cinq euros, la carte « Journée-Mer » dans une gare SNCF.","pts":[{"label":"what to do","groups":[["carte","gare","5","cinq"]]}],"maxWords":40},{"text":"Pourquoi Nicole a-t-elle décidé de ne plus voyager en voiture ?","marks":2.0,"t":"pc","model":"Nicole a décidé de ne plus voyager en voiture parce que le train était trop cher pour eux ; cette année, elle a acheté la carte « Journée-Mer ».","pts":[{"label":"the reason","groups":[["carte","train","cher"]]}],"maxWords":54},{"text":"Quelle nouvelle chose a-t-on introduite cette année ?","marks":2.0,"t":"pc","model":"On a introduit la possibilité de louer un vélo à la gare d'arrivée pour trois euros par jour.","pts":[{"label":"the new thing","groups":[["velo","louer"]]}],"maxWords":38},{"text":"Qu'est-ce qu'il faut faire pour pouvoir voyager quand on veut ?","marks":2.0,"t":"pr","model":"Pour pouvoir voyager quand on veut, il faut faire une réservation au moins dix jours avant le départ.","pts":[{"label":"what to do","groups":[["reservation","10","dix"]]}],"maxWords":38}]},{"id":"p24","label":"2019","title":"Être chirurgien en Afrique","passage":"Pendant plus de vingt ans, Monique travaillait comme chirurgien dans un grand hôpital de Paris. Et puis, à cinquante-cinq ans, l'âge où certains décident qu'il est temps de se reposer, Monique a décidé qu'elle voulait partir aider les habitants des pays où la vie est moins facile. Elle a alors rejoint l'organisation Médecins du Monde. Sa première mission était au Mali, en Afrique de l'Ouest, où elle a donné une formation aux jeunes qui voulaient devenir médecin. Puis elle est allée au Gabon, un autre pays d'Afrique. Quand elle rentre en France après chaque mission, tout ce qu'elle désire, c'est de repartir. À l'étranger, ses conditions d'hébergement sont souvent basiques : quand elle est en mission, elle vit, comme ses collègues médecins, dans les centres médicaux où elle travaille. « Les employés des centres médicaux vivent toujours dans ces situations d'urgence : catastrophes naturelles ou guerres. À cause de cela, les centres médicaux sont toujours pleins de blessés et de malades », dit-elle. En France, Monique trouvait triste d'avoir peu de contact avec ses collègues. Par contre, elle appréciait les relations amicales dans le travail avec les équipes de Médecins du Monde. « En mission, on partage tout, on mange ensemble, et quand on fait une pause, un de mes collègues m'emmène sur sa moto boire un verre et discuter… »","foot":"","qs":[{"text":"Quelle décision Monique a-t-elle prise à l'âge de cinquante-cinq ans et pourquoi ?","marks":3.0,"t":"pc","model":"À cinquante-cinq ans, Monique a décidé de partir aider les habitants des pays où la vie est moins facile.","pts":[{"label":"the decision","groups":[["partir","aider","rejoint"]]},{"label":"the reason","groups":[["facile","habitants","pays","vie"]]}],"maxWords":42},{"text":"Quels pays a-t-elle visité et qu'est-ce qu'elle a fait là-bas ?","marks":2.5,"t":"pc","model":"Elle a visité le Mali, où elle a donné une formation aux jeunes qui voulaient devenir médecin, et le Gabon.","pts":[{"label":"the countries","groups":[["mali"],["gabon"]]},{"label":"what she did","groups":[["formation","jeunes","medecin"]]}],"maxWords":42},{"text":"Décrivez les conditions d'hébergement aux centres médicaux.","marks":2.0,"t":"pr","model":"Les conditions d'hébergement sont souvent basiques : on vit dans les centres médicaux où l'on travaille.","pts":[{"label":"the conditions","groups":[["basique","centres","medicaux","pleins","blesse"]]}],"maxWords":33},{"text":"Quelles étaient les différences entre les centres médicaux en France et ceux du Médecins du Monde ?","marks":2.5,"t":"op","model":"En France, Monique trouvait triste d'avoir peu de contact avec ses collègues ; avec Médecins du Monde, elle appréciait les relations amicales et on partage tout.","pts":[{"label":"in France","groups":[["peu","contact","collegues","triste"]]},{"label":"with MdM","groups":[["amicale","partage","equipe"]]}],"maxWords":51}]},{"id":"p25","label":"Set 1","title":"Le Guide Michelin","passage":"Le guide Michelin est né au début du vingtième siècle. A cette époque, on donnait le livre aux chauffeurs. Mais à partir de 1920, on a fini par le vendre. Il y a deux guides Michelin : le Guide Rouge et le Guide Vert. Le Guide Rouge est le plus ancien des deux. Il existe depuis 1900. Il permet de trouver un restaurant ou un hôtel. Le Guide Vert est lance en 1920. C’est un guide touristique qui donne des informations sur l’histoire des villes et des régions. Il y a aussi des informations très intéressantes sur l’architecture et des descriptions très précises des bâtiments à visiter. Les guides Michelin ont eu beaucoup de succès dès le début, car ils ont fait un classement avec une, deux, ou trois étoiles. Peu à peu, Michelin a lancé un Guide Vert pour chaque région de France Il y a aujourd’hui un Guide Vert pour les principales destinations touristiques du monde.","foot":"","qs":[{"text":"Le Guide Michelin est né quand ? Il y a combien de guides Michelin ?","marks":2.5,"t":"pc","model":"Le guide Michelin est né au début du vingtième siècle ; il y a deux guides Michelin : le Guide Rouge et le Guide Vert.","pts":[{"label":"when","groups":[["vingtieme","1900","debut"]]},{"label":"how many","groups":[["deux","2"],["rouge"],["vert"]]}],"maxWords":47},{"text":"On a vendu le guide Michelin à partir de quand ?","marks":1.5,"t":"pc","model":"On a vendu le guide Michelin à partir de 1920.","pts":[{"label":"when","groups":[["1920"]]}],"maxWords":24},{"text":"Le Guide Rouge permet quoi ?","marks":1.5,"t":"pr","model":"Le Guide Rouge permet de trouver un restaurant ou un hôtel.","pts":[{"label":"what","groups":[["restaurant"],["hotel"]]}],"maxWords":25},{"text":"Quels sont les informations qu’on trouve dans le guide Vert ?","marks":2.5,"t":"pr","model":"Dans le guide Vert, on trouve des informations sur l'histoire des villes et des régions, sur l'architecture et des descriptions précises des bâtiments.","pts":[{"label":"history","groups":[["histoire"]]},{"label":"architecture","groups":[["architecture","description","batiment"]]}],"maxWords":47},{"text":"Comment est le guide Vert aujourd’hui ?","marks":2.0,"t":"pr","model":"Aujourd'hui, il y a un Guide Vert pour chaque région de France et pour les principales destinations touristiques du monde.","pts":[{"label":"France","groups":[["region"]]},{"label":"world","groups":[["monde","destination"]]}],"maxWords":42}]},{"id":"p26","label":"Set 2","title":"Tom et Nana : les Jeux Olympiques de Paris","passage":"Skate : Tom et Nana s’entraînent pour les Jeux olympiques de Paris Les Jeux olympiques de Paris débutent dans deux ans, le 26 juillet 2024 ! Tom, 13 ans, et Louise-Aïna, dite « Nana », 13 ans, s’y préparent déjà. Ces deux jeunes espoirs du skate espèrent bien se qualifier pour cette grande compétition. Pour se qualifier pour les J.O. de Paris de juillet 2024, les deux jeunes skateurs vont devoir livrer une rude et longue bataille. Au cours des deux années à venir, ils devront prouver, lors de plusieurs compétitions, qu’ils font partie des meilleurs du monde. Vêtu du maillot de foot de l’Olympique de Marseille, Tom réalise des figures dans les airs. Dès qu’il a cinq minutes, le jeune Marseillais plonge dans son bowl, près de la plage du Prado: «C’est comme mon second chez-moi, je peux y passer des heures sans voir le temps passer?!» Le bowl, c’est une cuvette spécialement conçue pour les skateurs, dans laquelle ils peuvent réaliser des figures. Vice-champion de France junior de skate alors qu’il fêtait tout juste ses 10 ans, Tom est sûr de vouloir devenir skateur professionnel. «Être aux Jeux Je l’espère bien?! Parfois, je m’imagine au village des athlètes en train de croiser des stars de tel ou tel sport.» Louise-Aïna, surnommée « Nana », a fait ses premiers pas sur une planche à roulettes à 6ans. Même si ses deux parents font de la planche à voile, et si elle pratique parfois ce sport sur l’étang de Leucate, dans l’Aude, Nana préfère glisser sur le béton. « De suite, j’ai adoré rivaliser avec les garçons, leur montrer que je pouvais faire comme eux, et même mieux !» Nana se remet d’une fracture à la cheville, qui l’a immobilisée pendant cinq mois. « Oui, j’aimerais participer aux Jeux olympiques, parce que c’est la plus grande compétition au monde, avec les meilleurs du monde dans tous les sports. Mais je ne me mets pas la pression. Si je n’arrive pas à me qualifier, ce n’est pas grave. Comme je suis jeune, j’ai le temps…» Depuis sa fracture, la jeune skateuse a appris une chose importante: «Quand tu es fatiguée, il faut savoir s’arrêter, sinon tu risques de te blesser…» Fin juin, à Marseille, Tom est devenu champion de France, et Nana championne de France des moins de 16 ans. Ça promet…En octobre, Tom participera aux Championnats du monde, au Brésil, et Nana espère pouvoir y être présente. Le but : gagner des points afin de se qualifier pour les J.O. Bonne chance Tom et Nana !","foot":"**Cuvette- Basin/Bowl","qs":[{"text":"Que font Tom et Nana comme sport professionnel ? Comment seront-ils qualifiés pour les prochains jeux olympiques ?","marks":2.0,"t":"pr","model":"Tom et Nana font du skate ; pour se qualifier pour les J.O. de Paris, ils doivent prouver, lors de plusieurs compétitions, qu'ils font partie des meilleurs du monde.","pts":[{"label":"the sport","groups":[["skate"]]},{"label":"how","groups":[["competition","meilleurs","points","prouver"]]}],"maxWords":58},{"text":"Décrivez comment Tom réalise des figures dans la cuvette ?","marks":2.0,"t":"pr","model":"Tom réalise des figures dans les airs dans le bowl, une cuvette conçue pour les skateurs, près de la plage du Prado.","pts":[{"label":"the figures","groups":[["figures","air"]]},{"label":"the place","groups":[["bowl","cuvette","prado"]]}],"maxWords":45},{"text":"Comment Tom se sent quand il fait ce sport ? Quel est son rêve ?","marks":2.0,"t":"pr","model":"Tom se sent comme chez lui dans le bowl : il peut y passer des heures sans voir le temps passer ; son rêve est de devenir skateur professionnel et de participer aux Jeux.","pts":[{"label":"feeling","groups":[["chez","heures","second"]]},{"label":"dream","groups":[["professionnel","jeux"]]}],"maxWords":63},{"text":"Nommez la raison pour laquelle Nana adore faire du skate au lieu de la planche à voile comme ses parents. Quelle leçon a-t-elle appris après sa blessure ?","marks":2.0,"t":"op","model":"Nana préfère le skate parce qu'elle a adoré rivaliser avec les garçons ; elle a appris que, quand on est fatigué, il faut savoir s'arrêter.","pts":[{"label":"the reason","groups":[["garcons","rivaliser"]]},{"label":"the lesson","groups":[["fatigu","arret"]]}],"maxWords":49},{"text":"Quel est le prochain grand objectif pour Tom et Nana ? Selon toi, nommez deux raisons pourquoi les sports sont importants pour les jeunes ados.","marks":2.0,"t":"op","model":"Leur prochain grand objectif est de participer aux Championnats du monde pour gagner des points ; les sports sont importants pour les ados parce qu'ils sont bons pour la santé et qu'ils apprennent à travailler en équipe.","pts":[{"label":"the goal","groups":[["championnat","monde","bresil","points","qualifi"]]},{"label":"two reasons","groups":[["sante","forme","exercice"],["equipe","collectif"],["amis","social"],["discipline","regle","respect"],["confiance","fier"],["stress","detend"]],"min":2}],"maxWords":70}]},{"id":"p27","label":"Set 4","title":"Être étudiant en France","passage":"Etre étudiant en France L’éducation en France n’est pas très chère. Une grande partie du coût est subventionnée par l’État. Après avoir réussi au baccalauréat, vous pouvez aller à l'université pour continuer vos études. Sorbonne Université à Paris est une des meilleures universités publiques en France. L'éducation à la Sorbonne et d'autres universités publiques est gratuite. L’État français continue de prendre en charge l’essentiel du coût de l'éducation dans un établissement d’enseignement supérieur public. Il faut payer seulement les frais d'inscription* qui ne sont pas très chers. Le système de santé français est généreux et universel. Au début de l’année académique, votre couverture santé est garantie. C’est simple, gratuit et automatique. L’adhésion au système français de sécurité sociale est obligatoire. Chacun qui habite légalement en France depuis trois mois ou plus est éligible à la carte vitale. Vous devez créer votre espace personnel, le compte ameli, sur www.ameli.fr. Vous devez vous inscrire avec vos informations comme votre adresse postale, votre médecin traitant etc. Après, vous allez recevoir votre carte vitale. Il faut déclarer un médecin traitant. Il faut mettre à jour votre carte vitale au moins une fois par année. Il y a des machines à la pharmacie ou au bureau du CPAM.","foot":"* les frais d'inscription- tuition fees Page 2","qs":[{"text":"Nommez une université française et décrivez-la.","marks":2.5,"t":"pr","model":"La Sorbonne Université à Paris est une des meilleures universités publiques en France ; l'éducation y est gratuite.","pts":[{"label":"the name","groups":[["sorbonne"]]},{"label":"description","groups":[["meilleure","gratuit","public"]]}],"maxWords":36},{"text":"Comment décrivez-vous le système d’éducation en France ?","marks":2.0,"t":"pr","model":"L'éducation en France n'est pas très chère : l'État prend en charge l'essentiel du coût et il faut payer seulement les frais d'inscription.","pts":[{"label":"cost","groups":[["chere","gratuit","subvention","etat"]]},{"label":"fees","groups":[["inscription","frais"]]}],"maxWords":45},{"text":"C’est quoi la couverture santé ?","marks":1.5,"t":"pr","model":"La couverture santé est la protection du système de santé français : elle est garantie, simple, gratuite et automatique.","pts":[{"label":"what it is","groups":[["garanti"],["simple"],["gratuit"],["automatique"],["sante"]],"min":2}],"maxWords":38},{"text":"Comment est-ce qu’on peut avoir son assurance médicale en France ?","marks":2.0,"t":"pr","model":"On peut avoir son assurance médicale en créant son espace personnel sur le compte ameli et en s'inscrivant ; ensuite on reçoit sa carte vitale.","pts":[{"label":"step 1","groups":[["compte","ameli","espace","inscri"]]},{"label":"step 2","groups":[["carte","vitale"]]}],"maxWords":49},{"text":"Combien de fois est-ce qu’on doit mettre à jour la carte vitale ? Où pouvez-vous aller si vous voulez mettre à jour ta carte vitale ?","marks":2.0,"t":"pr","model":"On doit mettre à jour la carte vitale au moins une fois par année, à la pharmacie ou au bureau du CPAM.","pts":[{"label":"how often","groups":[["une"],["fois","1","annee"]]},{"label":"where","groups":[["pharmacie","cpam"]]}],"maxWords":45}]},{"id":"p28","label":"Set 5","title":"Le cidre de glace du Québec","passage":"Le froid, ça se déguste ! Bien que le cidre ait été produit au Québec dès le 17e siècle par les Sulpiciens, il traverse des moments difficiles au cœur du 20e siècle et connaît une véritable renaissance dans les années 1980. Cette seconde vie s’accompagne d’une modernisation de son vocabulaire. Les producteurs ne s’appellent plus cidriers, comme en Europe, mais cidriculteurs. En parallèle est créé le mot cidriculture, pour désigner la culture de la pomme pour en faire du cidre. N’ayant pas d’équivalent, ce mot est aujourd’hui en voie d’adoption dans les autres régions cidricoles de la francophonie. Le Québec est reconnu pour ses pommes… et pour ses hivers rigoureux. S’inspirant du vin de glace, né en Allemagne et particulièrement bien établi en Ontario où les hivers sont plus constants qu’en Europe, les cidriculteurs du Québec ont créé le cidre de glace dans les années 1990. Ce cidre, apprécié internationalement, est aujourd’hui un des meilleurs ambassadeurs du terroir québécois. En décembre 2014, le gouvernement du Québec a adopté comme appellations réservées les indications géographiques protégées (IGP) cidre de glace du Québec et vin de glace du Québec. Dernier-né des cidres québécois, le cidre de feu connaît des débuts prometteurs. Recourant à la chaleur pour concentrer les sucres de la pomme, il est plus ambré, plus alcoolisé et un peu moins sucré que le cidre de glace. Bon hiver et bonne dégustation !","foot":"","qs":[{"text":"Depuis quand Québec a été producteur de cidre ?","marks":2.0,"t":"pc","model":"Le Québec a produit du cidre dès le 17e siècle.","pts":[{"label":"since when","groups":[["17","dix sept"]]}],"maxWords":24},{"text":"Comment s'appellent les producteurs de cidre en Europe et au Québec?","marks":2.5,"t":"pr","model":"En Europe, les producteurs s'appellent cidriers ; au Québec, ils s'appellent cidriculteurs.","pts":[{"label":"Europe","groups":[["cidrier"]]},{"label":"Quebec","groups":[["cidriculteur"]]}],"maxWords":25},{"text":"Quel est le produit considéré aujourd’hui comme l’un des meilleurs ambassadeurs du terroir québécois?","marks":2.0,"t":"pr","model":"Le cidre de glace est considéré aujourd'hui comme l'un des meilleurs ambassadeurs du terroir québécois.","pts":[{"label":"the product","groups":[["glace"]]}],"maxWords":33},{"text":"Où le vin de glace est né?","marks":2.0,"t":"pc","model":"Le vin de glace est né en Allemagne.","pts":[{"label":"where","groups":[["allemagne"]]}],"maxWords":20},{"text":"Quel est le dernier-né des cidres québécois?","marks":1.5,"t":"pr","model":"Le dernier-né des cidres québécois est le cidre de feu.","pts":[{"label":"which","groups":[["feu"]]}],"maxWords":25}]},{"id":"p29","label":"Set 6","title":"À quoi sert le prix Nobel ?","passage":"« A quoi sert le prix Nobel » Comme chaque année, les prix Nobel sont décernés. Ces prix récompensent des écrivains, des scientifiques et des artisans de la paix dans le monde.Le suédois Alfred Nobel était un savant particulier : à la fois inventeur de génie, homme d´affaires et poète. Il a mis au point du faux cuir, des vernis, des peintures et…la dynamite. Pour produire et vendre ces inventions, il a bâti quatre- vingt- dix usines et une immense fortune.Mais Alfred Nobel avait un rêve : faire cesser les guerres sur notre planète. A sa mort, en 1896, Alfred Nobel a laissé une importante somme d´argent. Il voulait récompenser ceux qui cherchent à améliorer la vie des hommes. Chaque année, six prix qui portent son nom sont attribués. Ces prix Nobel récompensent, depuis 1901, des scientifiques pour leurs travaux en physique, chimie, médecine ou économie (depuis 1969). Un prix Nobel de littérature est donné à un romancier ou à un poète. Enfin un prix Nobel de la paix est décerné à des personnes ou des associations qui œuvrent pour la paix.Les « nobélisés» reçoivent environ cinquante millions d´euros. Surtout, leurs travaux bénéficient d´une publicité mondiale. Ainsi, les causes défendues par les prix Nobel de la paix peuvent être connues et encouragées par un grand nombre de gens à travers le monde…","foot":"","qs":[{"text":"Relève du texte une phrase qui prouve qu´Alfred Nobel s´est occupé des intérêts de l´humanité.","marks":2.0,"t":"op","model":"Il a laissé une importante somme d'argent pour récompenser ceux qui cherchent à améliorer la vie des hommes.","pts":[{"label":"the sentence","groups":[["recompens","ameliorer","vie","hommes","guerres"]]}],"maxWords":38},{"text":"Quels sont les objectifs de ces prix ?","marks":2.0,"t":"pr","model":"Les objectifs de ces prix sont de récompenser ceux qui cherchent à améliorer la vie des hommes et ceux qui œuvrent pour la paix.","pts":[{"label":"the aims","groups":[["recompens","ameliorer","paix"]]}],"maxWords":49},{"text":"Pourquoi la « publicité mondiale » du prix de la paix peut-elle aider cette cause ?","marks":2.0,"t":"pr","model":"La publicité mondiale peut aider cette cause parce que les causes défendues peuvent être connues et encouragées par un grand nombre de gens à travers le monde.","pts":[{"label":"the reason","groups":[["connu","encourag","gens","monde"]]}],"maxWords":54},{"text":"Combien de prix sont-ils attribués chaque année ? Dans quels domaines ?","marks":2.5,"t":"pr","model":"Six prix sont attribués chaque année dans les domaines de la physique, de la chimie, de la médecine, de l'économie, de la littérature et de la paix.","pts":[{"label":"how many","groups":[["six","6"]]},{"label":"which fields","groups":[["physique"],["chimie"],["medecine"],["economie"],["litterature"],["paix"]],"min":3}],"maxWords":54},{"text":"Qui peut recevoir le prix Nobel de la paix ?","marks":1.5,"t":"pr","model":"Le prix Nobel de la paix peut être reçu par des personnes ou des associations qui œuvrent pour la paix.","pts":[{"label":"who","groups":[["personnes","associations","oeuvr"]]}],"maxWords":42}]},{"id":"p30","label":"Set 15","title":"Le tailleur de Baghdad","passage":"Il y avait une fois un tailleur qui demeurait à Baghdad. Un jour qu'il travaillait devant son échoppe un bossu est venu s' asseoir près de lui et s' est mis à chanter. Le tailleur était si enchaté de la chanson du bossu qu'il l'a invité à souper chez lui. La femme du tailleur avait déjà mis le couvert, parce qu'il était temps de souper, et elle avait servi un plat de poisson. Ils se sont mis tous trois à table, mais le bossu en mangeant a avalé par mégarde une grosse arête, qui s' est fixée dans sa gorge, et il est mort en peu de moments avant que le tailleur eût pu la retirer. Le tailleur et sa femme étaient très effrayés car ils avaient peur d'être soupçonnés du meurtre du bossu, et ils ont cherché de se débarrasser de son corps. Ils ont saisi le cadavre, l'un par les pieds, l' autre par les épaules, et l' ont porté jusqu' au logis d' un médecin juif qui demeurait tout près de là, ont frappé à porte contre laquelle ils l'ont appuyé, et se sont enfuits.","foot":"(une échoppe—stall; le bossu—hunchback; une arête—fish-bone; eût pu-could; soupçonner—to suspect; le meurtre—murder; juif—Jewish; appuyer—to lean; s' enfuir—to flee.)","qs":[{"text":"Que faisait le tailleur un jour ?","marks":1.0,"t":"imp","model":"Un jour, le tailleur travaillait devant son échoppe.","pts":[{"label":"what he was doing","groups":[["echoppe","travaill"]]}],"maxWords":20},{"text":"Qu'est-ce que le bossu a fait ?","marks":1.0,"t":"pc","model":"Le bossu est venu s'asseoir près de lui et s'est mis à chanter.","pts":[{"label":"what he did","groups":[["asseoir","chant"]]}],"maxWords":29},{"text":"Le tailleur a-t-il aimé la chanson du bossu ?","marks":1.0,"t":"pc","model":"Oui, le tailleur a aimé la chanson du bossu : il était si enchanté qu'il l'a invité à souper chez lui.","pts":[{"label":"yes","groups":[["oui"]]},{"label":"proof","groups":[["enchante","invite","souper"]]}],"maxWords":42},{"text":"Qu'est-ce que la femme du tailleur avait servi ?","marks":1.0,"t":"plq","model":"La femme du tailleur avait servi un plat de poisson.","pts":[{"label":"what","groups":[["poisson"]]}],"maxWords":24},{"text":"Que le bossu a-t-il avalé par mégarde ?","marks":1.0,"t":"pc","model":"Le bossu a avalé par mégarde une grosse arête.","pts":[{"label":"what","groups":[["arete"]]}],"maxWords":22},{"text":"Qu'est-ce qui s'est arrivé ensuite ?","marks":1.0,"t":"pc","model":"Ensuite, l'arête s'est fixée dans sa gorge et le bossu est mort en peu de moments.","pts":[{"label":"what happened","groups":[["mort","mouri","gorge"]]}],"maxWords":34},{"text":"Pourquoi le tailleur et sa femme étaient-ils effrayés ?","marks":1.0,"t":"imp","model":"Le tailleur et sa femme étaient effrayés parce qu'ils avaient peur d'être soupçonnés du meurtre du bossu.","pts":[{"label":"the reason","groups":[["peur","soupcon","meurtre"]]}],"maxWords":36},{"text":"Qu'est-ce qu'ils ont cherché ?","marks":1.0,"t":"pc","model":"Ils ont cherché à se débarrasser de son corps.","pts":[{"label":"what","groups":[["debarrass","corps","cadavre"]]}],"maxWords":22},{"text":"Où ont-ils porté le cadavre ?","marks":1.0,"t":"pc","model":"Ils ont porté le cadavre jusqu'au logis d'un médecin juif qui demeurait tout près de là.","pts":[{"label":"where","groups":[["medecin","logis","juif"]]}],"maxWords":34},{"text":"Qu'est-ce qu'ils ont fait ensuite ?","marks":1.0,"t":"pc","model":"Ensuite, ils ont frappé à la porte, ont appuyé le cadavre contre elle et se sont enfuis.","pts":[{"label":"what","groups":[["frapp","appuy","enfui","porte"]]}],"maxWords":36}]},{"id":"p31","label":"2015-16 Std IX (Paper 1)","title":"Le papier recyclé et Harry Potter","passage":"Les maisons d’édition publient des milliers de livres chaque année…et cela prend beaucoup de papier. Par exemple, le sixième volume de Harry Potter, avec un tirage de 10 millions d’exemplaires, a nécessité l’utilisation de 2000 tonnes de papier ! Ainsi, son auteur, JK Rowling, a pris la décision d’imprimer une version de son livre sur du papier FSC, c’est à dire du papier recycle fabrique à partir des chiffons, de carton ou de papiers collectes lors du tri. Sélectif. FSC est une organisation internationale fondée en 1993 par des propriétaires forestiers, des acteurs du secteur du bois et du papier, des mouvements sociaux et diverses organisations environnementales. Elle est constituée de plus de 800 membres répartis dans trois chambres (sociale, économique, environnementale) selon leur intérêt. L’organisation Greenpeace a contacté les éditeurs français pour les convaincre de faire de même, mais la majorité pense que le papier recyclé est moins agréable à l’œil que le papier ordinaire. Cependant, le papier recyclé n’est plus cher et son utilisation et une bonne action pour la planète. Greenpeace a également contacté les éditeurs de manuels scolaires 2 pour leur demander de les imprimer sur du papier recyclé car c’est une manière d’intéresser les enfants et les adolescents aux problèmes poses par l’utilisation du papier.","foot":"","qs":[{"text":"Quel est le problème de la publication de Harry Potter ?","marks":1.5,"t":"pr","model":"Le problème de la publication de Harry Potter est que cela prend beaucoup de papier : le sixième volume a nécessité 2000 tonnes de papier.","pts":[{"label":"the problem","groups":[["beaucoup"],["papier","2000","tonnes"]]}],"maxWords":49},{"text":"Donnez deux avantages du papier recyclé.","marks":2.5,"t":"pr","model":"Le papier recyclé n'est pas plus cher et son utilisation est une bonne action pour la planète.","pts":[{"label":"advantage 1","groups":[["cher"]]},{"label":"advantage 2","groups":[["planete","action"]]}],"maxWords":36},{"text":"Qu’a décidé JK Rowling ?","marks":1.5,"t":"pc","model":"JK Rowling a décidé d'imprimer une version de son livre sur du papier FSC.","pts":[{"label":"the decision","groups":[["imprim","fsc","recycl"]]}],"maxWords":31},{"text":"Qu’est-ce que le papier FSC ?","marks":2.5,"t":"pr","model":"Le papier FSC est du papier recyclé fabriqué à partir de chiffons, de carton ou de papiers collectés lors du tri sélectif.","pts":[{"label":"what it is","groups":[["recycl"]]},{"label":"made from","groups":[["chiffon","carton","papiers","tri"]]}],"maxWords":45},{"text":"Pourquoi l’organisation Greenpeace a-t-elle contacté les éditeurs de livres scolaires ?","marks":2.0,"t":"pc","model":"Greenpeace a contacté les éditeurs de livres scolaires pour leur demander d'imprimer les manuels sur du papier recyclé, car c'est une manière d'intéresser les enfants aux problèmes posés par le papier.","pts":[{"label":"what it asked","groups":[["recycl","imprim"]]},{"label":"why","groups":[["interess","enfants","problemes"]]}],"maxWords":61}]},{"id":"p32","label":"Set 7","title":"Un nouveau type d'école","passage":"Un nouveau type d’école Éducation & Nature est une école qui a été créée en 2005 dans une ferme. Elle se situe en Ardèche, une région de France qui a la chance d’avoir encore de nombreux sites sauvages d’une grande beauté. Quand Sophie a fondé cette école, elle venait d’avoir un quatrième enfant. Les écoles «classiques» ne lui plaisaient pas, car elles n’apprennent pas aux enfants à respecter l’environnement. Sophie décide donc de créer une école qui va encourager les enfants à adopter une façon de vivre qui respecte la nature. Dans cette école, les professeurs expliquent aux enfants comment utiliser moins les énergies comme le gaz et l’électricité. Les enfants découvrent aussi d’où vient la nourriture qu’ils mangent et comment la produire. Les enfants ont de 3 ans à 12 ans. Chaque matin, avant d’aller en classe suivre les cours comme dans les autres écoles, ils s’occupent des animaux de la ferme. Chaque soir, quand ils ont fini leurs devoirs pour l’école, les enfants vont chercher des œufs et ils font du beurre et du fromage. Ici, pas de courses au supermarché: toute la nourriture est produite à la ferme. Les «professeurs» de la ferme sont tous des bénévoles qui, dans le passé, travaillaient comme agriculteurs. Ils ont choisi maintenant de donner leur temps pour montrer aux enfants qu’on peut vivre en harmonie avec la nature. Aujourd’hui, le rêve de Sophie, c’est de créer des classes pour des enfants de 13 ans à 16 ans.","foot":"","qs":[{"text":"Pourquoi la région de l’Ardèche a-t-elle de la chance?","marks":1.0,"t":"pr","model":"La région de l'Ardèche a de la chance parce qu'elle a encore de nombreux sites sauvages d'une grande beauté.","pts":[{"label":"the reason","groups":[["sauvage","beaute","sites"]]}],"maxWords":40},{"text":"À quel moment de sa vie Sophie a-t-elle ouvert son école?","marks":1.0,"t":"pc","model":"Sophie a ouvert son école quand elle venait d'avoir un quatrième enfant.","pts":[{"label":"when","groups":[["quatrieme","enfant"]]}],"maxWords":27},{"text":"Dans cette école, quelle habitude va-t-on donner aux enfants?","marks":1.0,"t":"pr","model":"Dans cette école, on va donner aux enfants l'habitude de vivre d'une façon qui respecte la nature.","pts":[{"label":"the habit","groups":[["respect","nature","vivre"]]}],"maxWords":36},{"text":"Pourquoi les professeurs parlent-ils aux enfants de gaz et d’électricité?","marks":1.0,"t":"pr","model":"Les professeurs leur parlent de gaz et d'électricité pour leur expliquer comment utiliser moins les énergies.","pts":[{"label":"the reason","groups":[["moins","energie","utiliser"]]}],"maxWords":34},{"text":"Qu’est-ce que les enfants apprennent au sujet de la nourriture? Donnez 2 exemples.","marks":2.0,"t":"pr","model":"Les enfants apprennent d'où vient la nourriture qu'ils mangent et comment la produire.","pts":[{"label":"where from","groups":[["vient","origine"]]},{"label":"how to produce","groups":[["produi"]]}],"maxWords":29},{"text":"En quoi l’école de Sophie est-elle comme les autres écoles?","marks":1.0,"t":"pr","model":"L'école de Sophie est comme les autres écoles parce que les enfants suivent les cours en classe.","pts":[{"label":"the likeness","groups":[["cours","classe","devoirs"]]}],"maxWords":36},{"text":"Qu’est-ce que les enfants font le soir, pour aider à la ferme? Mentionnez 1 chose.","marks":1.0,"t":"pr","model":"Le soir, les enfants vont chercher des œufs et font du beurre et du fromage.","pts":[{"label":"one thing","groups":[["oeuf","beurre","fromage"]]}],"maxWords":33},{"text":"Quel métier faisaient les bénévoles avant de venir à la ferme?","marks":1.0,"t":"imp","model":"Avant de venir à la ferme, les bénévoles travaillaient comme agriculteurs.","pts":[{"label":"the job","groups":[["agriculteur"]]}],"maxWords":25},{"text":"Qu’est-ce que Sophie veut faire à l’avenir?","marks":1.0,"t":"pr","model":"Sophie veut créer des classes pour des enfants de 13 ans à 16 ans.","pts":[{"label":"the plan","groups":[["classes","13","16"]]}],"maxWords":31}]},{"id":"p33","label":"Set 16","title":"La sécurité sociale en France","passage":"La sécurité sociale est un programme d'assurance maladie nationale auquel tous les salariés et toutes les entreprises doivent contribuer. 100% des Français sont couverts par la sécurité sociale parce que c'est un droit fondamental garanti par la constitution. La sécurité sociale se caractérise aujourd'hui par une protection contre les risques sociaux généralisée à l'ensemble de la population mais séparée entre de nombreuses institutions faisant appel à des sources diversifiées de financement. L'Assurance Maladie s'est construite depuis 1945 sur trois principes fondamentaux : L'égalité d'accès aux soins, la qualité des soins, et la solidarité. C'est ainsi qu'elle permet à chacun de le faire soigner selon ses besoins, quelques soient son âge et son niveau de ressources. A l'origine, la sécurité sociale était réservée aux salariés et à leur famille. Depuis le premier janvier 2000, la couverte maladie universelle (CMU) permet à toute personne résidant en France de bénéficier d'une prise en charge de ses soins (maladie et maternité) quel que soit son activité. Autrefois, les Français pouvaient choisir leurs médecins et voir plusieurs docteurs s'ils le désiraient. Depuis 2005, ils doivent choisir un médecin généraliste. A l'exception de certains spécialistes comme le gynécologue et l'ophtalmologiste, ils ne peuvent plus aller voir un spécialiste sans avoir vu leur généraliste d'abord. Chaque assuré social possède une carte vitale (une petite carte verte de la sécurité sociale). A la fin d'une visite, le patient paie les honoraires du docteur. Plus tard, le patient est remboursé par la sécurité sociale pour les visites chez le médecin et pour la plupart des médicaments. Le médecin et le pharmacien doivent remplir les formulaires de la sécurité sociale. Aujourd'hui, en raison de vieillissement de la population et des excès commis par un certain nombre d'assurés sociaux, la sécurité sociale voit ses dépenses régulièrement dépasser son budget. Le gouvernement est en train de limiter certaines dépenses pour trouver des solutions au déficit budgétaire de la sécurité sociale.","foot":"","qs":[{"text":"Décrivez la sécurité sociale en bref.","marks":2.0,"t":"pr","model":"La sécurité sociale est un programme d'assurance maladie nationale auquel tous les salariés et toutes les entreprises doivent contribuer ; 100% des Français sont couverts.","pts":[{"label":"what it is","groups":[["assurance","programme"]]},{"label":"who","groups":[["contribu","couvert","100"]]}],"maxWords":49},{"text":"Par quoi, la sécurité se caractérise-t-elle aujourd'hui ?","marks":2.0,"t":"pr","model":"Aujourd'hui, la sécurité sociale se caractérise par une protection contre les risques sociaux généralisée à l'ensemble de la population mais séparée entre de nombreuses institutions.","pts":[{"label":"protection","groups":[["protection","risques","population"]]},{"label":"institutions","groups":[["institutions","financement"]]}],"maxWords":51},{"text":"Quels sont les principes fondamentaux de l'Assurance Maladie?","marks":1.5,"t":"pr","model":"Les principes fondamentaux de l'Assurance Maladie sont l'égalité d'accès aux soins, la qualité des soins et la solidarité.","pts":[{"label":"the principles","groups":[["egalite"],["qualite"],["solidarite"]]}],"maxWords":38},{"text":"Depuis 2005, les Français pouvaient-ils choisir leurs médecins et voir plusieurs docteurs s'ils le désiraient ?","marks":2.0,"t":"imp","model":"Non, depuis 2005, les Français ne pouvaient plus choisir leurs médecins : ils devaient choisir un médecin généraliste.","pts":[{"label":"no","groups":[["non"]]},{"label":"what instead","groups":[["generaliste"]]}],"maxWords":36},{"text":"Qui doivent remplir les formulaires de la sécurité sociale ?","marks":1.5,"t":"pr","model":"Le médecin et le pharmacien doivent remplir les formulaires de la sécurité sociale.","pts":[{"label":"who","groups":[["medecin"],["pharmacien"]]}],"maxWords":29},{"text":"Pourquoi la sécurité sociale, voit-elle ses dépenses régulièrement dépasser son budget ?","marks":1.0,"t":"pr","model":"La sécurité sociale voit ses dépenses dépasser son budget à cause du vieillissement de la population et des excès commis par certains assurés sociaux.","pts":[{"label":"the reason","groups":[["vieillissement","exces","assures"]]}],"maxWords":49}]},{"id":"p34","label":"Set 8","title":"Le commerçant et le garçon honnête","passage":"Un commerçant était très anxieux de voir des pièces d’argent disparaître de temps à temps de sa caisse. Il n’avait aucune prévue certaine de l’identité du voleur, mais il soupçonnait un pauvre garçon qui venait souvent faire ses courses au magasin. Quoique le commerçant aime beaucoup le garçon, il a décidé de le mettre à l’épreuve. Un jour, en voyant le garçon s’approcher, il est allé dans l’arrière-boutique, et il l’a appelé. Quand le garçon y est entré, le commerçant lui a demandé d’aller chercher une lettre qui était dans la caisse. Il avait compte tout l’argent dans le tiroir et de cette façon, si le garçon en prenait un peu, il apercevait immédiatement le vol. Le garçon a fait ce que lui demandait le commerçant et s’en est allé ensuite avec ce qu’il était venu acheter. Quand le commerçant a compté l’argent, pas un sou n’y manquait, mais il a découvert au fond du tiroir une fente étroite par où les pièces d’argent pouvaient glisser. Le commerçant a vidé complètement le tiroir et au fond de la caisse il a trouvé un grand tas de pièces, preuve que l’argent y était tombé pendant des mois et peut-être des années. Le commerçant a éprouvé une telle honte d’avoir soupçonné le garçon qu’il a décidé de lui payer une bonne éducation ou un excellent apprentissage à ses propres frais.","foot":"","qs":[{"text":"Pourquoi le commerçant était-il anxieux ?","marks":1.5,"t":"imp","model":"Le commerçant était anxieux parce que des pièces d'argent disparaissaient de temps à temps de sa caisse.","pts":[{"label":"the reason","groups":[["piece","argent","disparai"]]}],"maxWords":36},{"text":"Qui soupçonnait-il ?","marks":2.0,"t":"imp","model":"Il soupçonnait un pauvre garçon qui venait souvent faire ses courses au magasin.","pts":[{"label":"who","groups":[["garcon"]]},{"label":"description","groups":[["pauvre","courses","magasin"]]}],"maxWords":29},{"text":"Comment a-t-il mis le garçon à l’épreuve?","marks":2.5,"t":"pc","model":"Il a demandé au garçon d'aller chercher une lettre dans la caisse, après avoir compté tout l'argent dans le tiroir, pour voir si le garçon en prenait un peu.","pts":[{"label":"the request","groups":[["demande","lettre","caisse"]]},{"label":"the counting","groups":[["compte","argent","tiroir"]]},{"label":"the aim","groups":[["voir","prenait","vol"]]}],"maxWords":58},{"text":"Qu’est-ce qu’il y avait sous le tiroir de la caisse ?","marks":2.0,"t":"imp","model":"Sous le tiroir, il y avait une fente étroite par où les pièces d'argent pouvaient glisser, et au fond de la caisse un grand tas de pièces.","pts":[{"label":"the slit","groups":[["fente"]]},{"label":"the coins","groups":[["tas","pieces"]]}],"maxWords":54},{"text":"Le commerçant, qu’a-t-il décidé de faire ?","marks":2.0,"t":"pc","model":"Le commerçant a décidé de payer au garçon une bonne éducation ou un excellent apprentissage à ses propres frais.","pts":[{"label":"the decision","groups":[["education","apprentissage"]]},{"label":"at his own cost","groups":[["frais","payer"]]}],"maxWords":40}]},{"id":"p35","label":"Practice Paper (unlabelled)","title":"La vie de Farid","passage":"La vie de Farid Je m’appelle Farid et j’ai 10 ans. J’habite dans une banlieue pauvre du Caire, la capitale de L’Egypte. Je suis potier- je fais des pots de terre. Je travaille 10 heures par jour, tous les jours de la semaine. A la fin de la journée, on me paie un euro. Le matin, je me lève tôt vers six heures et je prends du pain avec une purée d’haricots. Après, je vais au travail à pied. Je commence à sept heures et je finis à cinq heures du soir. J’ai trois pauses de vingt minutes. Quand je ne travaille pas, je vais voir ma mère et mes trois frères. Mon père est décédé. Le soir, j’aide ma mère et je joue avec mes frères. D’habitude, je mange un plat simple, du pain et de la purée de légumes ou de la soupe. Je dors sur un morceau de carton. Je n’ai pas de lit. Moi, je suis assez content. J’aime ma famille, je mange tous les jours et j’ai du travail mais je voudrais aller à l’école comme les enfants dans les pays riches.","foot":"","qs":[{"text":"Comment est la routine de Farid ? Trouvez-vous que c’est difficile ? Pourquoi ?","marks":2.0,"t":"op","model":"La routine de Farid est difficile : il se lève à six heures, travaille dix heures par jour et on le paie un euro. Oui, je trouve que c'est difficile parce qu'il est un enfant.","pts":[{"label":"the routine","groups":[["six","sept","dix","travaille","pain","leve"]]},{"label":"your opinion","groups":[["difficile","dur","penible","fatigant","enfant"]]}],"maxWords":67},{"text":"Combien de personnes y a-t-il dans sa famille ? Quelles 2 activités fait-il avec eux ?","marks":3.0,"t":"pr","model":"Il y a cinq personnes dans sa famille ; le soir, il aide sa mère et il joue avec ses frères.","pts":[{"label":"how many","groups":[["cinq","5"]]},{"label":"activity 1","groups":[["aide"]]},{"label":"activity 2","groups":[["joue"]]}],"maxWords":42},{"text":"Qu’est-ce qui vous montre que la famille de Farid est pauvre ? Donnez au moins deux indications.","marks":1.5,"t":"pr","model":"La famille de Farid est pauvre : le père est décédé, il dort sur un morceau de carton, il n'a pas de lit et on lui paie un euro par jour.","pts":[{"label":"the signs","groups":[["carton"],["lit"],["euro"],["pain"],["puree"],["pere"],["mange"]],"min":2}],"maxWords":60},{"text":"Pourquoi Farid dit-il qu’il est content de sa vie ?","marks":1.5,"t":"pr","model":"Farid dit qu'il est content de sa vie parce qu'il aime sa famille, il mange tous les jours et il a du travail.","pts":[{"label":"the reasons","groups":[["famille","mange","travail"]]}],"maxWords":47},{"text":"Quel est le seul regret de sa vie ? Quelle est votre opinion de la vie de Farid ?","marks":2.0,"t":"op","model":"Son seul regret est de ne pas aller à l'école comme les enfants dans les pays riches ; à mon avis, sa vie est difficile et injuste.","pts":[{"label":"the regret","groups":[["ecole"]]},{"label":"your opinion","groups":[["avis","pense","trouve","opinion","crois","triste","dur","difficile","injuste","dommage"]]}],"maxWords":52}]},{"id":"p36","label":"2015-16 Std IX (Paper 2)","title":"L'automatisation et l'intelligence artificielle","passage":"En collaboration avec Foresight Factory, agence spécialisée dans l’analyse des tendances à venir, Michael Page a mené une étude sur les technologies et orientations qui définiront l’environnement de travail de demain. L’automatisation par une robotique avancée et l’intelligence artificielle n’affecteront pas seulement les postes exigeant des compétences élémentaires. Il y a également des gains économiques à réaliser dans la réduction du temps consacré aux tâches et services quotidiens exécutés par des collaborateurs plus confirmés. L’augmentation de l’automatisation va modifier le panorama des métiers. Si certains métiers pouvaient disparaitre, la plus grande part devrait se transformer, rendant les processus de re qualification et d’acquisition de nouvelles compétences indispensables pour réussir sur ce nouveau marché du travail. L’automatisation de tâches répétitives et basées sur des données conduira à la création de nouveaux types d’emplois, mettant l’accent sur une collaboration hommes – machine plus efficace : la cobotique. Lancé dans les médias en juin 2017, Moby Mart est un bel exemple de boutique entièrement automatisée. Il s’agit d’une épicerie mobile, sans personnel, qui vend tous les jours des articles courants comme du pain, du lait et des produits de nettoyage. CureSkin est une application mobile, pilotée par l’intelligence artificielle, qui peut diagnostiquer des problèmes de peau et conseiller des traitements et produits. Cette innovation nous montre que la reconnaissance des formes par l’intelligence artificielle peut effectuer la fonction de diagnostic des dermatologues. Elle illustre également à quel point il pourrait être facile de suivre et de surveiller sa santé sans intervention humaine.","foot":"","qs":[{"text":"Qu’est-ce que Michael Page a fait en collaboration avec Foresight factory ?","marks":2.0,"t":"pc","model":"Michael Page a mené une étude sur les technologies et orientations qui définiront l'environnement de travail de demain.","pts":[{"label":"what","groups":[["etude"]]},{"label":"about","groups":[["technologie","travail","demain","environnement"]]}],"maxWords":38},{"text":"Que savez-vous de Foresight Factory ?","marks":1.0,"t":"pr","model":"Foresight Factory est une agence spécialisée dans l'analyse des tendances à venir.","pts":[{"label":"what it is","groups":[["agence","tendances"]]}],"maxWords":27},{"text":"Comment est-ce que l’augmentation de l’automatisation va modifier le panorama des métiers ?","marks":2.0,"t":"op","model":"L'augmentation de l'automatisation va modifier le panorama des métiers : certains métiers pourraient disparaître, mais la plus grande part devrait se transformer.","pts":[{"label":"the changes","groups":[["disparai"]]},{"label":"the rest","groups":[["transform","competence","qualification"]]}],"maxWords":43},{"text":"Est-ce qu’il y aura des gains à cause de l’automatisation par une robotique avancée et l’intelligence artificielle ? Donnez un exemple.","marks":2.0,"t":"fut","model":"Oui, il y aura des gains économiques à réaliser dans la réduction du temps consacré aux tâches ; par exemple, Moby Mart est une boutique entièrement automatisée.","pts":[{"label":"yes","groups":[["oui"],["gain"]]},{"label":"example","groups":[["moby","cureskin"]]}],"maxWords":52},{"text":"Qu’est-ce que c’est Moby Mart ?","marks":1.0,"t":"pr","model":"Moby Mart est une épicerie mobile, sans personnel, entièrement automatisée.","pts":[{"label":"what it is","groups":[["epicerie","boutique"]]}],"maxWords":24},{"text":"Qu’est-ce qui est vendu à Moby Mart ?","marks":1.0,"t":"pr","model":"On vend à Moby Mart des articles courants comme du pain, du lait et des produits de nettoyage.","pts":[{"label":"what","groups":[["pain","lait","nettoyage"]]}],"maxWords":38},{"text":"Cherchez du texte la forme nominale de : créer","marks":1.0,"t":"op","model":"La forme nominale de « créer » est « création ».","pts":[{"label":"the noun","groups":[["creation"]]}],"maxWords":18}]},{"id":"p37","label":"Practice Paper (unlabelled)","title":"La tour Eiffel","passage":"La tour Eiffel (10) Quand les étrangers pensent à la ville de Paris, le premier monument auquel ils pensent est la tour Eiffel. Elle est aussi un des monuments les plus connus au monde. La tour Eiffel a été dessinée par un ingénieur qui s'appelait Gustave Eiffel. Gustave Eiffel est né le 15 décembre 1832, et lui et ses frères ont été élevés par leur grand-mère. Leurs parents étaient alors directeurs d'une grande usine de bois et travaillaient tous les deux. Ils ne pouvaient pas s'occuper de leurs trois enfants. Après avoir terminé ses études secondaires, Gustave a réussi aux concours pour entrer dans la meilleure école d'ingénieurs de France. En 1855, ses études d'ingénieur terminées, Gustave a tout de suite trouvé du travail. C'est cet emploi qui a donné à Gustave la chance de développer ses talents d'inventeur. En 1887, le gouvernement français décide de faire construire un monument spectaculaire pour célébrer les 100 ans de la Révolution française. Plusieurs ingénieurs proposent leurs idées mais le gouvernement choisit de faire construire la tour de 300 mètres de haut proposée par Gustave Eiffel. Le gouvernement trouve cette tour originale et élégante. Chaque année, des milliers de touristes viennent à Paris pour voir la tour Eiffel. Cependant, à l'époque de sa construction, certains Parisiens critiquaient la Tour en disant qu'elle était très laide. Encore plus étonnant, c'est qu'aujourd'hui un grand nombre de Parisiens ne sont jamais montés au sommet de la Tour. Pourtant, Jacqueline, une jeune touriste qui découvre la Tour pour la première fois, insiste : « Je vous assure qu'elle est plus belle en réalité que sur toutes les photos »..","foot":"","qs":[{"text":"Selon l'article, qu'est-ce que la tour Eiffel représente pour les étrangers ?","marks":1.0,"t":"pr","model":"Pour les étrangers, la tour Eiffel représente le premier monument auquel ils pensent quand ils pensent à Paris.","pts":[{"label":"what it means","groups":[["paris","premier","connu","monument"]]}],"maxWords":38},{"text":"(a) Quel rôle a joué la grand-mère de Gustave dans sa vie ?","marks":1.0,"t":"pc","model":"Les parents de Gustave travaillaient tous les deux et ne pouvaient pas s'occuper de leurs enfants ; sa grand-mère les a élevés.","pts":[{"label":"her role","groups":[["eleve","occup"]]}],"maxWords":45},{"text":"(b) Pourquoi Gustave et ses frères ont-ils été élevés par leur grand-mère ?","marks":1.0,"t":"op","model":"Ils ont été élevés par leur grand-mère parce que leurs parents travaillaient tous les deux et ne pouvaient pas s'occuper d'eux.","pts":[{"label":"the reason","groups":[["travaill","occup"]]}],"maxWords":45},{"text":"Où va Gustave à la fin de ses études secondaires?","marks":1.0,"t":"pr","model":"Gustave va dans la meilleure école d'ingénieurs de France.","pts":[{"label":"where","groups":[["ingenieur","ecole"]]}],"maxWords":22},{"text":"Qu'est-ce que le premier emploi de Gustave lui a permis de faire ?","marks":1.0,"t":"pc","model":"Son premier emploi lui a permis de développer ses talents d'inventeur.","pts":[{"label":"what it allowed","groups":[["developper","talent","inventeur"]]}],"maxWords":25},{"text":"Selon l'article, pour quelle raison le gouvernement a-t-il voulu faire construire un monument?","marks":1.0,"t":"pc","model":"Le gouvernement a voulu faire construire un monument spectaculaire pour célébrer les 100 ans de la Révolution française.","pts":[{"label":"the reason","groups":[["100","cent","revolution","celebr"]]}],"maxWords":38},{"text":"Quelles sont les 2 qualités de la tour proposée par Gustave?","marks":1.0,"t":"pr","model":"Les deux qualités de la tour sont qu'elle est originale et élégante.","pts":[{"label":"the qualities","groups":[["originale"],["elegante"]]}],"maxWords":27},{"text":"Pourquoi certains Parisiens n'aimaient-ils pas la tour Eiffel ?","marks":1.0,"t":"imp","model":"Certains Parisiens n'aimaient pas la tour Eiffel parce qu'ils pensaient qu'elle était très laide.","pts":[{"label":"the reason","groups":[["laide"]]}],"maxWords":31},{"text":"Qu'est-ce qu'il est surprenant d'apprendre au sujet des Parisiens aujourd'hui","marks":1.0,"t":"pr","model":"Il est surprenant d'apprendre qu'aujourd'hui un grand nombre de Parisiens ne sont jamais montés au sommet de la tour.","pts":[{"label":"what is surprising","groups":[["jamais","sommet","monte"]]}],"maxWords":40},{"text":"Comment Jacqueline a-t-elle réagi devant la tour Eiffel ?","marks":1.0,"t":"pc","model":"Jacqueline a réagi en insistant : elle assure que la tour est plus belle en réalité que sur toutes les photos.","pts":[{"label":"her reaction","groups":[["belle","photos","assure","insiste"]]}],"maxWords":42}]},{"id":"p38","label":"2022-23 First Preliminary Examination","title":"Comment est née la langue française ?","passage":"Comment est née la langue française? Tu parles français tous les jours, sans même y penser. Mais comment cette langue est-elle apparue ? Qui l’a parlée en premier ? Comment est née la langue française ? Du 14 au 22 mars, c’est la fête de la langue française. Elle est célébrée sur les cinq continents. Pourquoi ? Parce que le français est parlé par 300 millions de personnes, en France, en Belgique, au Québec, dans plusieurs pays d’Afrique… avec des accents différents ! Partout, les gens utilisent les mêmes mots et la même grammaire. Mais il a fallu 25 siècles pour inventer cette langue. Au fait, connais-tu l’histoire de la langue française ? Au 5e siècle , avant Jésus-Christ, la France parle trois langues : le grec, le ligure et le gaulois. En 50 avant Jésus-Christ, les Romains envahissent la France avec leur langue, le latin. Au 5e siècle, le peuple des Francs prend sa place. Ils prononcent le latin à leur manière, ajoutent leurs mots, et créent ainsi une nouvelle langue : le roman. En 800, Charlemagne remet le latin dans les écoles et les églises. Alors, les gens cultivés parlent latin, et le peuple, roman. Au 10e siècle, le roman a pris des centaines de formes différentes dans les régions. Pour dire oui, les gens du Nord disent oïl, les gens du Sud disent oc. Langue de Paris, langue des Français Peu à peu, c’est la langue parlée près de Paris qui se répand : le francien, ou français. Pour que tous les habitants se comprennent, le roi François 1er décide, en 1539, que les lois seront rédigées en français. Et, après la Révolution, l’école se fait en français. Au fil des siècles, des mots étrangers entrent dans la langue française : « pays » est un mot gaulois, « prudence » est latin, « magasin » est arabe et « Internet » est anglais. Tu vois, une langue, c’est vivant : ça grandit tout le temps !","foot":"","qs":[{"text":"Quand fête-t-on la fête de la langue française? Où est-elle célébrée ?","marks":2.0,"t":"pr","model":"On fête la langue française du 14 au 22 mars ; elle est célébrée sur les cinq continents.","pts":[{"label":"when","groups":[["14","22","mars"]]},{"label":"where","groups":[["continent","cinq"]]}],"maxWords":36},{"text":"Combien de personnes parlent la langue française et ou ?","marks":2.0,"t":"pr","model":"Trois cents millions de personnes parlent le français, en France, en Belgique, au Québec et dans plusieurs pays d'Afrique.","pts":[{"label":"how many","groups":[["300","trois"],["cent"]]},{"label":"where","groups":[["france","belgique","quebec","afrique"]]}],"maxWords":40},{"text":"Qui a mis le roman dans les écoles et les églises et quand","marks":2.0,"t":"pc","model":"Charlemagne a remis le latin dans les écoles et les églises en 800.","pts":[{"label":"who","groups":[["charlemagne"]]},{"label":"when","groups":[["800"]]}],"maxWords":29},{"text":"En Roman comment disait-on Oui au Nord et au Sud du pays.","marks":2.0,"t":"imp","model":"En roman, au Nord, on disait « oïl » et, au Sud, on disait « oc ».","pts":[{"label":"North","groups":[["oil"]]},{"label":"South","groups":[["oc"]]}],"maxWords":29},{"text":"e. Pensez -vous qu' une langue c’est vivante. Pourquoi justifiez votre réponse.","marks":2.0,"t":"op","model":"Oui, je pense qu'une langue est vivante parce que des mots étrangers entrent dans la langue française et qu'elle grandit tout le temps.","pts":[{"label":"your opinion","groups":[["oui","pense","crois","non"]]},{"label":"your reason","groups":[["etranger","grandit","entrent","evolu","mot"]]}],"maxWords":47}]},{"id":"p39","label":"2024 St Germain Academy","title":"Une vie de voyages","passage":"UNE VIE DES VOYAGES Assise dans son fauteuil, son chat sur les genoux, cette vieille dame de 90 ans ressemble à beaucoup d'autres vieilles dames. Et pourtant, peu de gens ont eu une vie aussi pleine d'aventures qu'Hélène Seillard. A la fin de la deuxième guerre mondiale, elle avait juste 20 ans. Pour oublier cette période horrible elle décide de partir en voilier(ship) avec sa meilleure amie et de découvrir la Méditerranée. Ce premier voyage lui plaît tellement que lorsque son amie rentre chez elle à la fin du voyage, Hélène Seillard décide de ne pas rentrer en France et de continuer ses voyages. Pour gagner l'argent dont elle a besoin, elle propose au directeur d'un grand journal de faire un reportage sur un pays totalement inconnu alors en Europe et qu’elle rêve depuis toujours de visiter: l'Afghanistan. \"La beauté sauvage de ce pays de montagnes est extraordinaire se souvient-elle. Mais ce que je n'oublierai jamais c'est la générosité des Afghans, souvent si pauvres et toujours prêts à tout partager.\" Bien sûr il n test pas facile pour une femme seule de voyager à cette époque. Mais aucune difficulté n'arrête Hélène, qui voyage le plus souvent habillée en homme (dressed like a man). De retour d'Afghanistan, on lui demande un nouveau reportage, sur la Chine. Sans hésiter, Hélène repart. Partout où elle se rend, Hélène refuse de rester dans les hôtels. Elle choisit de vivre chez les habitants: \"je pouvais ainsi observer les coutumes, les manières de vivre. Mon seul regret a été de ne pas pouvoir communiquer avec les gens dans leur langue\" Aujourd'hui Hélène est devenue trop âgée pour quitter sa maison. Mais elle continue à voyager dans sa tête: elle relit ses carnets de voyage, et raconte ses voyages à ses petits-enfants, fiers d'avoir une grand mère exceptionnelle.","foot":"","qs":[{"text":"Pourquoi Hélène Seillard est-elle différente des gens de son âge?","marks":1.0,"t":"pr","model":"Hélène Seillard est différente des gens de son âge parce qu'elle a eu une vie pleine d'aventures.","pts":[{"label":"the difference","groups":[["aventure"]]}],"maxWords":36},{"text":"Pour quelle raison décide-t-elle de partir la première fois?","marks":1.0,"t":"pr","model":"Elle décide de partir pour oublier cette période horrible de la deuxième guerre mondiale.","pts":[{"label":"the reason","groups":[["oublier","guerre","horrible"]]}],"maxWords":31},{"text":"Quelle décision prend-elle après son voyage en Méditerranée?","marks":1.0,"t":"pr","model":"Après son voyage en Méditerranée, Hélène Seillard décide de ne pas rentrer en France et de continuer ses voyages.","pts":[{"label":"the decision","groups":[["rentrer","continuer","voyages"]]}],"maxWords":40},{"text":"Comment fait-elle pour aller découvrir l'Afghanistan et qu'est-ce qu'elle a le plus aimé en Afghanistan?","marks":2.0,"t":"pr","model":"Pour aller en Afghanistan, elle propose au directeur d'un grand journal de faire un reportage ; elle a le plus aimé la générosité des Afghans.","pts":[{"label":"how","groups":[["reportage","journal"]]},{"label":"what she liked","groups":[["generosite"]]}],"maxWords":49},{"text":"Qu'est-ce qui était difficile à l'époque où voyageait Hélène?","marks":1.0,"t":"imp","model":"À l'époque, il n'était pas facile pour une femme seule de voyager.","pts":[{"label":"the difficulty","groups":[["femme","seule","facile"]]}],"maxWords":27},{"text":"Quelle -solution Hélène trouve-t-elle à cette difficulté?","marks":1.0,"t":"pr","model":"Hélène trouve une solution : elle voyage le plus souvent habillée en homme.","pts":[{"label":"the solution","groups":[["homme","habille"]]}],"maxWords":27},{"text":"Pendant ses voyages, où Hélène choisit-elle de loger? Pourquoi ?","marks":2.0,"t":"pr","model":"Hélène choisit de vivre chez les habitants parce qu'ainsi elle peut observer les coutumes et les manières de vivre.","pts":[{"label":"where","groups":[["habitants"]]},{"label":"why","groups":[["coutumes","manieres","observer"]]}],"maxWords":40},{"text":"A la fin de l'article, on dit que maintenant Hélène 'voyage dans sa tête'. Expliquez cette expression.","marks":1.0,"t":"op","model":"« Voyager dans sa tête » veut dire qu'elle se souvient de ses voyages en relisant ses carnets de voyage et en racontant ses voyages à ses petits-enfants.","pts":[{"label":"the meaning","groups":[["carnets","souvient","raconte","imagin","memoire"]]}],"maxWords":54}]},{"id":"p40","label":"2024 St Germain Academy (duplicate)","title":"Astérix et Obélix","passage":"Astérix et Obélix «Le papyrus de César », le nouvel album des aventures d'Astérix et Obélix est sorti et c'est déjà un succès. Dans cet album, les deux héros, les plus connus de la Gaule, Astérix et Obélix affrontent leur meilleur ennemi, Jules César. On y trouve en effet des références à Internet et aux réseaux sociaux. On rencontre ainsi une certain Rézowifik. Même les oiseaux de la forêt sont bleus et font « twiit » (en référence au réseau Twitter). Parmi les autres nouveaux personnages il y a Bonus Promoplus, un méchant peu engageant. Pour le reste, les bonnes recettes qui font le succès de la série sont bien présentes : la potion magique, les distributions de baffes, du sanglier, un banquet ou encore un célèbre barde que l'on empêche de chanter. Ce nouvel album est le 36e de la série. Et c'est déjà un succès. Il a été tiré à 4,2 millions d'exemplaires. On est loin des 6000 exemplaires du tout premier publié en 1961. Les deux héros ont été imaginés pour la première fois par René Goscinny et Albert Uderzo dès 1951. Alors, Astérix et Obélix ont fait leurs premières apparitions dans le magazine Pilote avant de paraître, 10 ans plus tard, sous la forme d'un album,« Astérix le Gaulois ». A la mort de René Goscinny en 1977, Albert Uderzo a continué seul la série. Maintenant, âgé de 88 ans, il a passé le relais à d'autres dessinateurs, Jean-Yves Ferri et Didier Conrad.","foot":"","qs":[{"text":"Qu'est-ce que c'est « Le papyrus de César » ?","marks":2.0,"t":"pr","model":"« Le papyrus de César » est le nouvel album des aventures d'Astérix et Obélix.","pts":[{"label":"what it is","groups":[["album","aventures"]]}],"maxWords":29},{"text":"Y a-t-il des références aux réseaux sociaux ?","marks":2.0,"t":"pr","model":"Oui, il y a des références à Internet et aux réseaux sociaux dans l'album.","pts":[{"label":"yes","groups":[["oui"]]}],"maxWords":31},{"text":"Nommez deux éléments qui font le succès de la série.","marks":2.0,"t":"pr","model":"Les éléments qui font le succès de la série sont la potion magique, les distributions de baffes, le sanglier, un banquet et un célèbre barde qu'on empêche de chanter.","pts":[{"label":"two elements","groups":[["potion"],["baffes"],["sanglier"],["banquet"],["barde"]],"min":2}],"maxWords":58},{"text":"Qui a imaginé les deux héros pour la première fois ? Quand ?","marks":2.5,"t":"pc","model":"René Goscinny et Albert Uderzo ont imaginé les deux héros pour la première fois en 1951.","pts":[{"label":"who","groups":[["goscinny"],["uderzo"]]},{"label":"when","groups":[["1951"]]}],"maxWords":34},{"text":"Nommez des autres dessinateurs qui continuent maintenant.","marks":1.5,"t":"pr","model":"Jean-Yves Ferri et Didier Conrad continuent maintenant la série.","pts":[{"label":"who","groups":[["ferri"],["conrad"]]}],"maxWords":24}]},{"id":"p41","label":"2015-16 Std IX (Paper 3)","title":"Le Petit Chaperon Rouge","passage":"Il y avait une petite fille qui à appelait le Petit Chaperon Rouge ,parce ce qu’elle portait toujours un grand manteau à chaperon rouge. Un jour sa mère lui dit de prendre quelques gâteaux et du vin à sa grande - mère malade et elle lui a averti de ne pas s’amuser en route. Mais en allant à travers le bois,elle a vu de beaux papillons qu’elle voulait essayer d’attraper et de belles fleurs dont elle voulait faire un bouquet pour sa grande - mère. Un loup qui l’ avait remarqué, est venue à elle, et d’ une voix très douce lui a demandé où elle allait, « Chez ma grand - mère demeure là bas près du moulin »a dit la petite fille étourdie. «Mais votre panier a l’air très lourd,»a ajouté le loup.«Qu’est-ce que vous portez »«Des gâteaux et du vin», a répondu Le Petit Chaperon Rouge, «car ma grand - mère est malade et ce bon vin va la fortifier et la guérir.».","foot":"","qs":[{"text":"Comment la petite fille s’appelait-elle","marks":1.0,"t":"imp","model":"La petite fille s'appelait le Petit Chaperon Rouge.","pts":[{"label":"name","groups":[["chaperon"],["rouge"]]}],"maxWords":20},{"text":"Qu’est que la petite fille portait toujours ?","marks":1.0,"t":"imp","model":"La petite fille portait toujours un grand manteau à chaperon rouge.","pts":[{"label":"what","groups":[["manteau"]]}],"maxWords":25},{"text":"Qu’est-ce que sa mère lui a dit ?","marks":1.0,"t":"pc","model":"Sa mère lui a dit de prendre quelques gâteaux et du vin pour sa grand-mère malade.","pts":[{"label":"what","groups":[["gateaux"],["vin"]]}],"maxWords":36},{"text":"De quoi sa mère lui a -t - elle averti ?","marks":1.0,"t":"pc","model":"Sa mère l'a avertie de ne pas s'amuser en route.","pts":[{"label":"what","groups":[["amuser"]]}],"maxWords":24},{"text":"Qu’est-ce qu’il y avait à travers le bois ?","marks":1.0,"t":"imp","model":"À travers le bois, il y avait de beaux papillons et de belles fleurs.","pts":[{"label":"what","groups":[["papillons"],["fleurs"]]}],"maxWords":31},{"text":"Qui a remarqué la jeune fille ?","marks":1.0,"t":"pc","model":"Un loup a remarqué la jeune fille.","pts":[{"label":"who","groups":[["loup"]]}],"maxWords":18},{"text":"Où demeurait la grande - mère ?","marks":1.0,"t":"imp","model":"La grand-mère demeurait là-bas, près du moulin.","pts":[{"label":"where","groups":[["moulin"]]}],"maxWords":22},{"text":"Qu’ est - ce que le loup lui a demandé ?","marks":1.0,"t":"pc","model":"Le loup lui a demandé où elle allait et ce qu'elle portait.","pts":[{"label":"question 1","groups":[["allait","ou"]]},{"label":"question 2","groups":[["portait","panier"]]}],"maxWords":27},{"text":"Que lui a- t- elle répondu?","marks":1.0,"t":"pc","model":"Elle lui a répondu : des gâteaux et du vin, parce que sa grand-mère est malade.","pts":[{"label":"the answer","groups":[["gateaux"],["vin"]]}],"maxWords":34},{"text":"Qu’est-ce qui va fortifier et guérir la grand- mère malade ?","marks":1.0,"t":"fut","model":"Ce bon vin va fortifier et guérir la grand-mère malade.","pts":[{"label":"what","groups":[["vin"]]}],"maxWords":25}]},{"id":"p42","label":"2023 First Terminal Examination","title":"La télé tue la famille","passage":"« La télé tue la famille.» En 2000, Stéphane Gendron a pris les grands moyens et a jeté les trois téléviseurs de la maison aux poubelles. C’était le début d’une nouvelle vie. C’était devenu un cancer familial. Les enfants étaient tous rendus accros, c’était rendu fou!» lance le maire Gendron. Quel a été le déclic pour lui faire poser un geste si drastique? «Un soir, mon fils était branché sur la télévision et je lui ai dit quatre fois de venir dîner. Je passais ma main devant son visage et il était comme un zombie. Là, je me suis dit «C’est asse
